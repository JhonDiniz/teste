<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena de Leilão — Anime Battle Draft</title>
<style>
  :root{
    --bg: #0d0f14;
    --panel: #161922;
    --panel2: #1e222e;
    --line: #2a2f3d;
    --gold: #e0b559;
    --gold-dim: #8a6f36;
    --crimson: #d1495b;
    --crimson-dim: #6b2530;
    --teal: #4fb3a9;
    --text: #eceef2;
    --text-dim: #9aa0af;
    --weak: #7a8194;
    --medium: #4fb3a9;
    --strong: #d1495b;
    --physical: #e0b559;
    --magic: #7f77dd;
    --radius: 10px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 700px 400px at 20% -5%, rgba(224,181,89,.10) 0%, transparent 60%),
      radial-gradient(ellipse 700px 400px at 85% 0%, rgba(209,73,91,.08) 0%, transparent 60%),
      radial-gradient(circle at 50% 0%, #1a1e29 0%, var(--bg) 60%);
    color: var(--text);
    margin:0;
    min-height:100vh;
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 920px; margin:0 auto;}
  h1,h2,h3{font-weight:700; letter-spacing:.3px; margin:0 0 6px;}
  h1{font-size:26px;}
  h2{font-size:19px;}
  h3{font-size:15px;}
  .eyebrow{
    text-transform:uppercase; font-size:11px; letter-spacing:2px; color: var(--gold);
    font-weight:700; margin-bottom:4px;
  }
  .sub{color:var(--text-dim); font-size:14px; margin-bottom:20px;}
  .card{
    background: linear-gradient(180deg, var(--panel), #12141c);
    border:1px solid var(--line);
    border-top:2px solid var(--gold-dim);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom:16px;
  }
  .btn{
    background: linear-gradient(180deg, #2a2f3d, #1e222e);
    border:1px solid var(--line);
    color: var(--text);
    padding: 11px 18px;
    border-radius: 8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover{border-color: var(--gold-dim);}
  .btn:active{transform: scale(.97);}
  .btn.primary{background: linear-gradient(180deg, #e0b559, #c79a3f); color:#1a1509; border:none; box-shadow:0 2px 10px rgba(224,181,89,.25);}
  .btn.primary:hover{box-shadow:0 3px 16px rgba(224,181,89,.4); transform:translateY(-1px);}
  .btn.danger{background: linear-gradient(180deg, #d1495b, #a83447); color:#fff; border:none;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  input[type=text], input[type=number]{
    background: var(--panel2);
    border:1px solid var(--line);
    color: var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    width:100%;
  }
  label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .center{text-align:center;}
  .logo-badge{display:flex; justify-content:center; margin-bottom:10px; filter:drop-shadow(0 0 18px rgba(224,181,89,.35));}
  .code-display{
    font-size:38px; font-weight:800; letter-spacing:8px; color:var(--gold);
    text-align:center; padding:14px 0; font-family: monospace;
  }
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px;
    font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  }
  .badge.weak{background:rgba(122,129,148,.18); color:var(--weak);}
  .badge.medium{background:rgba(79,179,169,.18); color:var(--medium);}
  .badge.strong{background:rgba(209,73,91,.18); color:var(--strong);}
  .badge.physical{background:rgba(224,181,89,.18); color:var(--physical);}
  .badge.magic{background:rgba(127,119,221,.18); color:#a29bea;}
  .badge.hybrid{background:rgba(224,181,89,.12); color:#c9b98a;}
  .badge.ult{background:rgba(209,73,91,.25); color:#ff8a9a; border:1px solid var(--crimson-dim);}
  .badge.once{background:rgba(224,181,89,.12); color:var(--gold); border:1px solid var(--gold-dim);}
  .badge.rank-S{background:rgba(224,181,89,.28); color:#ffd97a; border:1px solid var(--gold);}
  .badge.rank-A{background:rgba(209,73,91,.2); color:#ff8a9a; border:1px solid var(--crimson);}
  .badge.rank-B{background:rgba(79,179,169,.2); color:#7fd8cd; border:1px solid var(--teal);}
  .badge.rank-C{background:rgba(122,129,148,.2); color:#b7bcc9; border:1px solid var(--weak);}
  .char-hero{
    text-align:center; padding: 22px 0 10px;
  }
  .char-hero .name{font-size:26px; font-weight:800; margin-bottom:4px;}
  .char-hero .anime{color:var(--text-dim); font-size:13px; margin-bottom:10px;}
  .stat-row{display:flex; justify-content:center; gap:22px; margin:14px 0 4px; flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .val{font-size:22px; font-weight:800;}
  .stat .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  .attacks{display:grid; grid-template-columns:1fr; gap:8px; margin-top:14px;}
  .attack{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .attack .an{font-weight:700; font-size:13.5px;}
  .attack .ad{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .players-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.players-grid{grid-template-columns:1fr;}}
  .player-panel{
    background:var(--panel2); border:1px solid var(--line); border-radius: var(--radius); padding:14px;
  }
  .player-panel.leader{border-color: var(--gold-dim); box-shadow: 0 0 0 1px var(--gold-dim) inset;}
  .player-panel h3{display:flex; justify-content:space-between; align-items:center;}
  .money{color:var(--gold); font-weight:800;}
  .team-list{list-style:none; padding:0; margin:10px 0 0; font-size:13px;}
  .team-list li{padding:5px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between;}
  .team-list li:first-child{border-top:none;}
  .team-list .slot-empty{color:var(--text-dim); font-style:italic;}
  .bid-controls{display:flex; gap:8px; margin-top:12px;}
  .bid-controls input{flex:1;}
  .log{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    max-height:140px; overflow-y:auto; font-size:12.5px; color:var(--text-dim); margin-top:14px;
  }
  .log div{padding:3px 0; border-bottom:1px dashed var(--line);}
  .log div:last-child{border-bottom:none;}
  .pill-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .pill-tabs button{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text-dim);
    padding:9px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer;
  }
  .pill-tabs button.active{background:var(--gold); color:#1a1509; border-color:var(--gold);}
  .hint{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .ultimate-box{
    border:1px dashed var(--crimson-dim); background:rgba(209,73,91,.06); border-radius:8px;
    padding:10px 12px; margin-top:10px; font-size:12.5px;
  }
  .roster-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media(max-width:600px){.roster-grid{grid-template-columns:1fr;}}
  .mini-card{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px;
  }
  .mini-card .mn{font-weight:700; font-size:13.5px;}
  .mini-card .ma{font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:8px; width:100%; font-size:13px;
  }
  .status-line{font-size:12.5px; color:var(--text-dim); text-align:center; margin-top:8px;}
  .flash{animation: flashIn .4s ease;}
  @keyframes flashIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .coin-stage{display:flex; flex-direction:column; align-items:center; padding:30px 0;}
  .coin{
    width:90px; height:90px; border-radius:50%;
    background: linear-gradient(180deg,var(--gold),#a9822f);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#1a1509; font-size:13px;
    border:3px solid #7a601f;
    perspective:600px;
  }
  .coin.flipping{animation: coinFlip 1.4s ease-in-out;}
  @keyframes coinFlip{
    0%{transform:rotateY(0deg);}
    100%{transform:rotateY(1800deg);}
  }
  .turn-banner{
    text-align:center; padding:10px; border-radius:8px; margin-bottom:14px;
    background:rgba(224,181,89,.1); border:1px solid var(--gold-dim); font-weight:700; font-size:14px;
  }
  .turn-banner.opp{background:rgba(209,73,91,.08); border-color:var(--crimson-dim);}
  .arena-row{display:flex; gap:10px; overflow-x:auto; padding:16px 2px 14px; justify-content:center; flex-wrap:wrap; position:relative;}
  .fighter-card{
    flex:0 0 auto; width:96px; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1.5px solid var(--line);
    border-radius:12px; padding:8px 6px; text-align:center; cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s;
    position:relative;
  }
  .fighter-card:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
  .fighter-card.active-turn{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 6px 18px rgba(224,181,89,.25); transform:scale(1.06);}
  .active-tag{
    position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#1a1509; font-size:8.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.4px; padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .fighter-card.targetable{border-color:var(--crimson); box-shadow:0 0 0 2px var(--crimson-dim);}
  .fighter-card.targetable:hover{box-shadow:0 0 0 2px var(--crimson), 0 6px 18px rgba(209,73,91,.3);}
  .fighter-card.dead{opacity:.3; cursor:not-allowed;}
  .fighter-card.stunned{border-color:#a29bea;}
  .fighter-card .fn{font-size:10.5px; font-weight:700; margin-top:4px; line-height:1.2; height:24px; overflow:hidden;}
  .fighter-card .fa{font-size:8.5px; color:var(--text-dim); margin-bottom:4px;}
  .hpbar{height:6px; background:#000; border-radius:4px; overflow:hidden; margin-top:6px;}
  .hpbar-fill{height:100%; background:linear-gradient(90deg,#7a2b34,var(--crimson));}
  .hp-txt{font-size:9px; color:var(--text-dim); margin-top:3px;}
  .shield-mini{display:flex; justify-content:center; gap:6px; font-size:8.5px; color:var(--text-dim); margin-top:2px;}
  .action-panel{margin-top:14px;}
  .atk-btn{
    display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; color:var(--text);
  }
  .atk-btn:hover:not(:disabled){border-color:var(--gold-dim);}
  .atk-btn:disabled{opacity:.35; cursor:not-allowed;}
  .atk-btn .an{font-weight:700; font-size:13px;}
  .atk-btn .ad{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .stick{display:block; margin:0 auto;}

  .order-list{display:flex; flex-direction:column; gap:8px;}
  .order-item{
    display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; cursor:grab;
  }
  .order-item:active{cursor:grabbing;}
  .order-pos{
    width:26px; height:26px; flex:0 0 auto; border-radius:50%; background:var(--gold); color:#1a1509;
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .order-info{flex:1; min-width:0;}
  .order-name{font-weight:700; font-size:13.5px;}
  .order-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .order-arrows{display:flex; flex-direction:column; gap:3px;}
  .order-arrows .btn{padding:2px 10px; font-size:12px; line-height:1;}

  .badge.element-Fogo{background:rgba(224,90,45,.18); color:#ff9d6b;}
  .badge.element-Gelo{background:rgba(111,179,217,.18); color:#a6d9f2;}
  .badge.element-Elétrico{background:rgba(224,181,89,.2); color:#ffe27a;}
  .badge.element-Sombrio{background:rgba(107,63,160,.22); color:#c9a6ff;}
  .badge.element-Sagrado{background:rgba(224,181,89,.22); color:#fff2c2;}
  .badge.element-Venenoso{background:rgba(58,143,74,.2); color:#8fe0a0;}
  .badge.element-Espiritual{background:rgba(138,111,191,.2); color:#d4c2ff;}
  .badge.element-Psíquico{background:rgba(224,120,168,.2); color:#ffb3d9;}
  .badge.element-Vento{background:rgba(47,168,158,.2); color:#8ce8dc;}
  .badge.element-Terra{background:rgba(165,103,60,.22); color:#e0b98a;}
  .badge.element-Água{background:rgba(55,138,221,.2); color:#a6cdff;}
  .badge.element-Metal{background:rgba(154,154,154,.2); color:#dcdcdc;}
  .badge.element-Natureza{background:rgba(58,143,74,.2); color:#a0e0af;}
  .badge.element-Normal{background:rgba(122,129,148,.18); color:#c2c6d1;}
</style>
</head>

// CHAR_KIT: hand-authored per-character stats + attacks, same order as APPEARANCE/RAW.
// Each entry: {life, physShield, magShield, attacks:[melee, spec1, spec2]}
// Power scaling both within each anime AND across anime verses (Dragon Ball >> most,
// Saitama/Solo Leveling/Frieren/JJK top-tier near the top but not absurd, grounded
// non-combat series like Death Note/Kaguya-sama/Horimiya/Your Name/Haikyuu/Blue Lock
// sit much lower). Shields kept low and asymmetric (physical vs magic) per character.
// Effects (shield/heal/debuff/stun) are assigned only where they fit the character —
// most specials are plain damage with no effect.

function E(type,value){ return value!==undefined ? {type,value} : {type}; }
function A(name,dmgType,dmg,cooldown,effect,onceOnly){
  return {name, dmgType, category: cooldown===0?"melee":"special", dmg, cooldown, effect: effect||null, onceOnly: !!onceOnly};
}

{life:41,physShield:10,magShield:4,attacks:[
  A("Corte com Kunai","physical",8,0),
  A("Chuva de Armas Ninja","physical",20,2,null),

const CHARACTERS = [];
let cid=1;
Object.keys(RAW).forEach(anime=>{
  RAW[anime].forEach((row,idx)=>{
    const [name, level, type] = row;
    const thisId = cid++;
    const kit = CHAR_KIT[thisId-1];
    const ap = APPEARANCE[thisId-1];
    const ct = CLASS_TYPE[thisId-1];
    const fourthAtk = FOURTH_ATTACK[thisId-1];
    const character = {
      id: "c"+thisId,
      name, anime, level, type,
      class: ct[0], element: ct[1],
      life: kit.life, physShield: kit.physShield, magShield: kit.magShield,
      attacks: [...kit.attacks, fourthAtk],
      appearance: ap ? {skin:ap[0], hairColor:ap[1], hairStyle:ap[2], outfit:ap[3], outfit2:ap[4]} : null,
      ultimate: null // assigned below, only for S/A-rank characters
    };
    CHARACTERS.push(character);
  });
});

// Rank each character S/A/B/C purely from base combat stats (life, shields, total
// attack power across all 4 attacks, and how many control/utility effects they carry).
// Ultimates are NOT part of this score — they're a reward handed out AFTER ranking,
// only to S/A characters, which is why the two steps must stay in this order.
(function rankCharacters(){
  const scored = CHARACTERS.map(c=>{
    const atkPower = c.attacks.reduce((sum,a)=> sum + (a.dmg||0), 0);
    const effectBonus = c.attacks.filter(a=>a.effect).length * 6;
    const score = c.life + (c.physShield+c.magShield)*1.3 + atkPower*1.4 + effectBonus;
    return {c, score};
  }).sort((a,b)=>b.score-a.score);
  const n = scored.length;
  scored.forEach((entry,i)=>{
    const pct = i/n;
    entry.c.rank = pct<0.15 ? "S" : pct<0.40 ? "A" : pct<0.75 ? "B" : "C";
    if(entry.c.rank==="S" || entry.c.rank==="A"){
      const u = ULTIMATES[entry.c.name];
      if(u) entry.c.ultimate = {name:u.name, lifeBonus:u.lifeBonus, dmgBonus:u.dmgBonus, desc:u.desc};
    }
  });
})();

/* ============ STATE ============ */
let ROOM_CODE = null;
let MY_SLOT = null; // 1 or 2
let pollTimer = null;
let LAST_STATE = null;
let LAST_REV = -1;

function genCode(){
  const letters="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<5;i++) s+=letters[Math.floor(Math.random()*letters.length)];
  return s;
}

function newRoomState(code){
  const shuffled=[...CHARACTERS].sort(()=>Math.random()-0.5);
  const pool = shuffled.slice(0,20).map(c=>c.id);
  return {
    code,
    rev: 0,
    players:{p1:null, p2:null},
    budget: {p1:20, p2:20},
    teams: {p1:[], p2:[]},
    pool,
    poolIndex:0,
    phase:"lobby", // lobby | coinflip | auction | ultimate | battle | battleover
    currentBid:{amount:0, by:null},
    turnToAct:null,
    noBidDesists:0,
    coinResult:null,
    ultimateChoice:{p1:null, p2:null},
    log:[]
  };
}

async function loadRoom(code){
  try{
    const doc = await db.collection("rooms").doc(code).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error("Erro ao carregar sala:", e); return null; }
}
async function saveRoom(state){
  try{
    state.rev = (state.rev||0)+1;
    await db.collection("rooms").doc(state.code).set(state);
  }catch(e){ console.error("Erro ao salvar sala:", e); }
}
async function commitAndDraw(state){
  await saveRoom(state);
  LAST_STATE = state;
  LAST_REV = state.rev;
  draw(state);
}

function charById(id){ return CHARACTERS.find(c=>c.id===id); }

/* ============ RENDER ============ */
const app = document.getElementById("app");

function render(){
  if(!ROOM_CODE){ renderHome(); return; }
  return loadRoom(ROOM_CODE).then(state=>{
    if(!state){ renderHome(); return; }
    LAST_STATE = state;
    LAST_REV = state.rev||0;
    draw(state);
  });
}

// Called on the polling interval: only redraws the screen if the room's revision
// number actually changed (avoids wiping out whatever the player is typing/clicking).
function poll(){
  if(!ROOM_CODE) return;
  return loadRoom(ROOM_CODE).then(state=>{
    if(!state) return;
    const rev = state.rev||0;
    if(rev===LAST_REV) return; // nothing changed, skip redraw
    LAST_STATE = state;
    LAST_REV = rev;
    draw(state);
  });
}

function draw(state){
  if(state.phase==="lobby") renderLobby(state);
  else if(state.phase==="auction") renderAuction(state);
  else if(state.phase==="ultimate") renderUltimate(state);
  else if(state.phase==="order") renderOrder(state);
  else if(state.phase==="coinflip") renderCoinflip(state);
  else if(state.phase==="battle") renderBattle(state);
  else if(state.phase==="battleover") renderBattleOver(state);
  else if(state.phase==="done") renderDone(state);
}

function playerName(state,key){
  return (state.players[key] && state.players[key].name) || ("Jogador "+key.slice(1));
}
function otherKey(key){ return key==="p1"?"p2":"p1"; }

function leaveRoom(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  ROOM_CODE = null; MY_SLOT = null; LAST_STATE = null; LAST_REV = -1;
  render();
}

async function createRoom(){
  const name = (document.getElementById("createName").value||"").trim() || "Jogador 1";
  const code = genCode();
  const state = newRoomState(code);
  state.players.p1 = {name};
  await saveRoom(state);
  ROOM_CODE = code; MY_SLOT = 1;
  startPolling();
}

async function joinRoom(){
  const name = (document.getElementById("joinName").value||"").trim();
  const code = document.getElementById("joinCode").value.trim().toUpperCase();
  if(!code){ return; }
  const state = await loadRoom(code);
  if(!state){ alert("Sala não encontrada. Confira o código."); return; }
  if(!state.players.p2 && !state.players.p1){
    state.players.p1 = {name: name || "Jogador 1"};
    await saveRoom(state);
    ROOM_CODE = code; MY_SLOT = 1;
  } else if(!state.players.p2){
    state.players.p2 = {name: name || "Jogador 2"};
    await saveRoom(state);
    ROOM_CODE = code; MY_SLOT = 2;
  } else {
    ROOM_CODE = code; MY_SLOT = 2;
  }
  startPolling();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  render();
  pollTimer = setInterval(poll, 2000);
}

  const bothIn = state.players.p1 && state.players.p2;
  app.innerHTML = `
    <div class="eyebrow">Sala criada</div>

      </div>

async function goToCoinflip(){
  const state = await loadRoom(ROOM_CODE);
  state.phase = "coinflip";
  await commitAndDraw(state);
}

async function startAuction(){
  if(MY_SLOT!==1) return;
  const state = await loadRoom(ROOM_CODE);
  if(state.phase!=="coinflip") return; // already started
  state.phase = "auction";
  setupCharacterTurn(state);
  state.log.unshift("Leilão iniciado — orçamento de R$20 cada, abertura de lance alternando por personagem.");
  await commitAndDraw(state);
}

function setupCharacterTurn(state){
  let opener = openerFor(state, state.poolIndex);
  if(state.teams[opener].length>=5) opener = otherKey(opener);
  state.turnToAct = opener;
  state.currentBid = {amount:0, by:null};
  state.noBidDesists = 0;
}

function openerFor(state, idx){
  return idx%2===0 ? state.coinResult : otherKey(state.coinResult);
}

function renderAuction(state){
  if(state.poolIndex >= state.pool.length || (state.teams.p1.length>=5 && state.teams.p2.length>=5)){
    finishAuction(state);
    return;
  }
  const currentId = state.pool[state.poolIndex];
  const c = charById(currentId);
  if(!c){ advanceCharacter(state); return; }

  const myKey = "p"+MY_SLOT;
  const oppKey = otherKey(myKey);
  const myTurn = state.turnToAct===myKey;
  const isOpening = state.currentBid.amount===0;
  const myBudget = state.budget[myKey];

  let controlsHTML = "";
  if(isOpening){
    controlsHTML = myTurn
      ? `<h3 style="margin-bottom:10px;">É a sua vez de abrir o lance</h3>
         <div class="bid-controls">
           <input type="number" id="bidAmt" placeholder="Valor do lance (R$)">
           <button class="btn primary" onclick="openBid()">Dar lance</button>
           <button class="btn danger" onclick="openDesist()">Passar</button>
         </div>
         <p class="hint">Seu saldo: R$ ${myBudget} · Vagas restantes: ${5-state.teams[myKey].length}</p>`
      : `<h3 style="margin-bottom:6px;">Aguardando ${playerName(state,oppKey)} abrir o lance...</h3>`;
  } else {
    const leaderName = playerName(state, state.currentBid.by);
    controlsHTML = myTurn
      ? `<h3 style="margin-bottom:10px;">Lance atual: <span class="money">R$ ${state.currentBid.amount}</span> (liderando: ${leaderName})</h3>
         <div class="bid-controls">
           <input type="number" id="bidAmt" placeholder="Novo valor (R$)">
           <button class="btn primary" onclick="raiseBid()">Aumentar lance</button>
           <button class="btn danger" onclick="respondDesist()">Passar</button>
         </div>
         <p class="hint">Seu saldo: R$ ${myBudget} · Vagas restantes: ${5-state.teams[myKey].length}</p>`
      : `<h3 style="margin-bottom:6px;">Lance atual: <span class="money">R$ ${state.currentBid.amount}</span> — você está liderando! Aguardando resposta de ${playerName(state,oppKey)}...</h3>`;
  }

  app.innerHTML = `
    <div class="eyebrow">Leilão — ${state.poolIndex+1} / ${state.pool.length}</div>
    <h1>Disputa em andamento</h1>
    <div class="card">
      <div class="char-hero">
        <span class="badge ${c.type}">${c.type==='physical'?'Físico':c.type==='magic'?'Mágico':'Híbrido'}</span>
        <div class="name" style="margin-top:8px;">${c.name}</div>

        <div style="margin-top:14px;">${stickFigureSVG(c, true)}</div>
      </div>

    <div class="card">
      ${controlsHTML}
    </div>

    <div class="players-grid">
      ${renderPlayerPanel(state,1)}
      ${renderPlayerPanel(state,2)}
    </div>

    <div class="log">
      ${state.log.slice(0,10).map(l=>`<div>${l}</div>`).join("")}

}

function describeEffect(e){
  if(e.type==="shield") return "+"+e.value+" de escudo";
  if(e.type==="heal") return "cura "+e.value+" de vida";
  if(e.type==="debuff") return "-"+e.value+" no escudo do alvo";
  if(e.type==="stun") return "atordoa por 1 turno";
  if(e.type==="dot") return e.value+" de dano contínuo por 2 turnos";
  return "";
}

function renderPlayerPanel(state, slot){
  const key="p"+slot;
  const isMe = MY_SLOT===slot;
  const leading = state.currentBid.by===key;
  return `
    <div class="player-panel ${leading?'leader':''}">
      <h3>${playerName(state,key)} ${isMe?'(você)':''} <span class="money">R$ ${state.budget[key]}</span></h3>
      <ul class="team-list">
        ${Array.from({length:5}).map((_,i)=>{
          const cid=state.teams[key][i];
          if(!cid) return `<li class="slot-empty">Vaga ${i+1} — vazia</li>`;
          const ch=charById(cid);
          return `<li><span>${ch.name}</span></li>`;
        }).join("")}
      </ul>
    </div>
  `;
}

async function openBid(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const input = document.getElementById("bidAmt");
  const amt = parseInt(input.value,10);
  if(!amt || amt<=0){ alert("O lance precisa ser maior que zero."); return; }
  if(amt>state.budget[myKey]){ alert("Você não tem saldo suficiente."); return; }
  const c = charById(state.pool[state.poolIndex]);
  state.currentBid = {amount:amt, by:myKey};
  state.log.unshift(`${playerName(state,myKey)} abriu o lance em ${c.name} com R$${amt}.`);
  const opp = otherKey(myKey);
  if(state.teams[opp].length>=5){
    await awardCharacter(state, myKey, c);
  } else {
    state.turnToAct = opp;
  }
  await commitAndDraw(state);
}

async function openDesist(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const c = charById(state.pool[state.poolIndex]);
  state.noBidDesists = (state.noBidDesists||0) + 1;
  const opp = otherKey(myKey);
  if(state.noBidDesists>=2 || state.teams[opp].length>=5){
    state.log.unshift(`${playerName(state,myKey)} também passou em ${c.name} — ele fica de fora.`);
    advanceCharacter(state);
  } else {
    state.log.unshift(`${playerName(state,myKey)} passou a abertura do lance em ${c.name}. Passou a vez.`);
    state.turnToAct = opp;
  }
  await commitAndDraw(state);
}

async function raiseBid(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const input = document.getElementById("bidAmt");
  const amt = parseInt(input.value,10);
  if(!amt || amt<=state.currentBid.amount){ alert("O lance precisa ser maior que o atual."); return; }
  if(amt>state.budget[myKey]){ alert("Você não tem saldo suficiente."); return; }
  const c = charById(state.pool[state.poolIndex]);
  state.currentBid = {amount:amt, by:myKey};
  state.log.unshift(`${playerName(state,myKey)} aumentou o lance em ${c.name} para R$${amt}.`);
  const opp = otherKey(myKey);
  if(state.teams[opp].length>=5){
    await awardCharacter(state, myKey, c);
  } else {
    state.turnToAct = opp;
  }
  await commitAndDraw(state);
}

async function respondDesist(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const c = charById(state.pool[state.poolIndex]);
  const leader = state.currentBid.by;
  state.log.unshift(`${playerName(state,myKey)} passou em ${c.name}.`);
  await awardCharacter(state, leader, c);
  await commitAndDraw(state);
}

async function awardCharacter(state, winnerKey, c){
  state.teams[winnerKey].push(c.id);
  state.budget[winnerKey] -= state.currentBid.amount;
  state.log.unshift(`${playerName(state,winnerKey)} levou ${c.name} por R$${state.currentBid.amount}!`);
  advanceCharacter(state);
}

function advanceCharacter(state){
  state.poolIndex += 1;
  if(state.poolIndex < state.pool.length && !(state.teams.p1.length>=5 && state.teams.p2.length>=5)){
    setupCharacterTurn(state);
  } else {
    state.currentBid = {amount:0, by:null};
  }
}

function finishAuction(state){
  state.phase = "ultimate";
  saveRoom(state).then(render);
}

async function chooseUltimate(val){
  const state = await loadRoom(ROOM_CODE);
  state.ultimateChoice["p"+MY_SLOT] = val || null;
  await saveRoom(state);
}

async function confirmReady(){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(state.ultimateChoice[myKey]===undefined) state.ultimateChoice[myKey]=null;
  state["_ready"+myKey] = true;
  if(state["_readyp1"] && state["_readyp2"]){
    state.phase="order";
    state.attackOrder = {p1:[...state.teams.p1], p2:[...state.teams.p2]};
    state.orderReady = {p1:false, p2:false};
  }
  await commitAndDraw(state);
}

/* ============ ATTACK ORDER (pre-battle) ============ */
function renderOrder(state){
  const myKey="p"+MY_SLOT;
  const oppKey = otherKey(myKey);
  const myOrder = state.attackOrder[myKey];
  const myReady = state.orderReady && state.orderReady[myKey];
  const oppReady = state.orderReady && state.orderReady[oppKey];
  app.innerHTML = `
    <div class="eyebrow">Antes da batalha</div>
    <h1>Defina a ordem de ataque</h1>
    <p class="sub">Arraste (no computador) ou use as setas pra decidir em que ordem seus 5 lutadores vão agir.</p>
    <div class="card">
      <div class="order-list">
        ${myOrder.map((id,i)=>{
          const c=charById(id);
          return `<div class="order-item" draggable="${myReady?'false':'true'}" ondragstart="onOrderDragStart(${i})" ondragover="event.preventDefault()" ondrop="onOrderDrop(${i})">
            <div class="order-pos">${i+1}</div>
            ${stickFigureSVG(c,true)}
            <div class="order-info"><div class="order-name">${c.name} <span class="badge rank-${c.rank}">${c.rank}</span></div><div class="order-sub">${c.class} · <span class="badge element-${c.element}">${ELEMENT_ICON[c.element]||''} ${c.element}</span></div></div>
            <div class="order-arrows">
              <button class="btn" ${i===0||myReady?'disabled':''} onclick="moveOrderItem(${i},-1)">▲</button>
              <button class="btn" ${i===myOrder.length-1||myReady?'disabled':''} onclick="moveOrderItem(${i},1)">▼</button>
            </div>
          </div>`;
        }).join("")}
      </div>
      ${myReady
        ? `<p class="status-line" style="margin-top:14px;">Ordem confirmada! Aguardando ${playerName(state,oppKey)}${oppReady?'':'...'}</p>`
        : `<div class="center" style="margin-top:16px;"><button class="btn primary" onclick="confirmOrder()">Confirmar ordem</button></div>`}
    </div>
  `;
}

let dragSrcIndex = null;
function onOrderDragStart(i){ dragSrcIndex = i; }
async function onOrderDrop(i){
  if(dragSrcIndex===null || dragSrcIndex===i){ dragSrcIndex=null; return; }
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(state.orderReady && state.orderReady[myKey]){ dragSrcIndex=null; return; }
  const arr = state.attackOrder[myKey];
  const [item] = arr.splice(dragSrcIndex,1);
  arr.splice(i,0,item);
  dragSrcIndex=null;
  await commitAndDraw(state);
}

async function moveOrderItem(index, direction){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(state.orderReady && state.orderReady[myKey]) return;
  const arr = state.attackOrder[myKey];
  const newIndex = index+direction;
  if(newIndex<0 || newIndex>=arr.length) return;
  [arr[index],arr[newIndex]] = [arr[newIndex],arr[index]];
  await commitAndDraw(state);
}

async function confirmOrder(){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(!state.orderReady) state.orderReady={p1:false,p2:false};
  state.orderReady[myKey]=true;
  if(state.orderReady.p1 && state.orderReady.p2){
    state.battle = initBattle(state);
    state.phase="battle";
    resolveStunSkipsAndAdvance(state);
  }
  await commitAndDraw(state);
}

/* ============ BATTLE ENGINE ============ */
function initBattle(state){
  const battle = {
    currentTurn: state.coinResult,
    orderIndex: {p1:0, p2:0},
    hp:{}, cooldowns:{}, onceUsed:{}, stunned:{}, shields:{}, dmgBonus:{}, maxLifeBonus:{}, ultimateUsed:{}, dot:{},
    log:["A batalha começou!"]
  };
  [...state.teams.p1, ...state.teams.p2].forEach(id=>{
    const c = charById(id);
    battle.hp[id]=c.life;
    battle.shields[id]={phys:c.physShield, mag:c.magShield};
    battle.cooldowns[id]=[0,0,0,0];
    battle.onceUsed[id]=[false,false,false,false];
    battle.stunned[id]=false;
    battle.dmgBonus[id]=0;
    battle.maxLifeBonus[id]=0;
  });
  return battle;
}

// Pure lookup: which of this player's characters is up to act right now, walking
// forward from their order cursor and skipping anyone already defeated.
function getActiveId(state, key){
  const order = state.attackOrder[key];
  const b = state.battle;
  const len = order.length;
  for(let i=0;i<len;i++){
    const cand = order[(b.orderIndex[key]+i)%len];
    if(b.hp[cand]>0) return cand;
  }
  return null;
}

// If whoever's up next (per the fixed order) is stunned, their turn is auto-skipped
// and their stun clears right then — this is what makes stun a one-turn effect
// instead of a permanent lock (a stunned character could never "act" to clear it
// under the old free-choice system, which is exactly what caused the infinite stun).
function resolveStunSkipsAndAdvance(state){
  let guard=0;
  while(guard++<20){
    const key = state.battle.currentTurn;
    const activeId = getActiveId(state, key);
    if(!activeId) return;
    if(state.battle.stunned[activeId]){
      const c = charById(activeId);
      state.battle.log.unshift(`${c.name} estava atordoado e perdeu a vez.`);
      state.battle.stunned[activeId] = false;
      const pos = state.attackOrder[key].indexOf(activeId);
      state.battle.orderIndex[key] = (pos+1) % state.attackOrder[key].length;
      state.battle.currentTurn = key==="p1" ? "p2" : "p1";
      continue;
    }
    return;
  }
}

function maxLifeOf(state, id){
  const c = charById(id);
  return c.life + (state.battle.maxLifeBonus[id]||0);
}

function teamOf(state,id){
  return state.teams.p1.includes(id) ? "p1" : "p2";
}

function aliveIds(state, key){
  return state.teams[key].filter(id=>state.battle.hp[id]>0);
}

let pendingAttackIdx = null;

const ELEMENT_ICON = {
  Fogo:"🔥", Gelo:"❄️", Elétrico:"⚡", Sombrio:"🌑", Sagrado:"✨", Venenoso:"☠️",
  Espiritual:"👻", "Psíquico":"🌀", Vento:"🌪️", Terra:"🪨", "Água":"💧", Metal:"⚙️", Natureza:"🌿", Normal:"◽"
};

function renderBattle(state){
  const myKey="p"+MY_SLOT;
  const oppKey = otherKey(myKey);
  const myTurn = state.battle.currentTurn===myKey;
  const myTeam = state.teams[myKey];
  const oppTeam = state.teams[oppKey];
  const myActiveId = getActiveId(state, myKey);
  const oppActiveId = getActiveId(state, oppKey);

  const attackerChar = (myTurn && myActiveId) ? charById(myActiveId) : null;
  const chosenAttack = (attackerChar && pendingAttackIdx!=null) ? attackerChar.attacks[pendingAttackIdx] : null;
  const needsTarget = chosenAttack && !['shield','heal'].includes(chosenAttack.effect && chosenAttack.effect.type);
  const targetMode = myTurn && chosenAttack && needsTarget;

  app.innerHTML = `

    <h1>Arena</h1>
    <div class="turn-banner ${myTurn?'':'opp'}">${myTurn ? `Sua vez — ${ELEMENT_ICON[attackerChar.element]||''} ${attackerChar.name} age agora` : `Vez de ${playerName(state,state.battle.currentTurn)} (${oppActiveId?charById(oppActiveId).name:'?'})`}</div>

    <div class="card">
      <h3>Time inimigo ${targetMode?'— toque em quem vai atacar':''}</h3>
      <div class="arena-row">
        ${oppTeam.map((id,i)=>fighterCardHTML(state,id, targetMode, id===oppActiveId, i, oppTeam.length)).join("")}
      </div>

      <h3>Seu time</h3>
      <div class="arena-row">
        ${myTeam.map((id,i)=>fighterCardHTML(state,id, false, id===myActiveId, i, myTeam.length)).join("")}
      </div>

      ${myTurn && attackerChar ? `
      <div class="action-panel">
        <h3>${attackerChar.name} <span class="badge rank-${attackerChar.rank}">${attackerChar.rank}</span> — escolha o ataque</h3>
        <p class="hint" style="margin-top:-6px; margin-bottom:10px;">${attackerChar.class} · <span class="badge element-${attackerChar.element}">${ELEMENT_ICON[attackerChar.element]||''} ${attackerChar.element}</span></p>
        ${attackerChar.attacks.map((a,i)=>{
          const cdLeft = state.battle.cooldowns[myActiveId][i];
          const usedOnce = a.onceOnly && state.battle.onceUsed[myActiveId][i];
          const disabled = cdLeft>0 || usedOnce;
          const typeTag = a.dmgType==='physical' ? '<span class="badge physical">Físico</span>' : '<span class="badge magic">Mágico</span>';
          return `<button class="atk-btn" ${disabled?'disabled':''} onclick="selectAttack(${i})">
            <div class="an">${a.name} ${typeTag} ${a.onceOnly?'<span class="badge once">único</span>':''} ${pendingAttackIdx===i?'✓':''}</div>
            <div class="ad">${disabled ? (usedOnce?'já usado nessa partida':'em cooldown ('+cdLeft+' turnos)') : (a.category==='melee'?'sem cooldown':'cooldown '+a.cooldown+' turnos')+(a.dmg?' · '+a.dmg+' dano':'')+(a.effect?' · '+describeEffect(a.effect):'')}</div>
          </button>`;
        }).join("")}
        ${chosenAttack && !needsTarget ? `<button class="btn primary" onclick="executeSelfAction()">Confirmar</button>` : ''}
        ${state.ultimateChoice[myKey]===myActiveId && !state.battle.ultimateUsed[myActiveId] ? `
          <div class="ultimate-box">
            <strong>${attackerChar.ultimate.name}</strong> — ${attackerChar.ultimate.desc}<br>
            +${attackerChar.ultimate.lifeBonus} vida, +${attackerChar.ultimate.dmgBonus} dano
            <div style="margin-top:8px;"><button class="btn danger" onclick="useUltimate()">Ativar Ultimate (usa o turno)</button></div>
          </div>` : ''}
        ${pendingAttackIdx!=null ? `<button class="btn" onclick="cancelSelection()">Cancelar seleção</button>` : ''}
      </div>` : ''}
    </div>

    <div class="log">
      ${state.battle.log.slice(0,12).map(l=>`<div>${l}</div>`).join("")}
    </div>
  `;
}

function fighterCardHTML(state, id, clickable, isActive, index, total){
  const c = charById(id);
  const hp = state.battle.hp[id];
  const alive = hp>0;
  const maxHp = maxLifeOf(state,id);
  const pct = Math.max(0,Math.round((hp/maxHp)*100));
  const shields = state.battle.shields[id];
  const isStunned = state.battle.stunned[id];
  const hasDot = state.battle.dot && state.battle.dot[id];
  const classes = ["fighter-card"];
  if(!alive) classes.push("dead");
  if(isActive && alive) classes.push("active-turn");
  if(clickable && alive) classes.push("targetable");
  if(isStunned && alive) classes.push("stunned");
  const clickAttr = (clickable && alive) ? `onclick="selectTarget('${id}')"` : "";
  const mid = (total-1)/2;
  const dist = Math.abs(index-mid);
  const liftPx = Math.max(0, 12 - dist*7);
  return `
    <div class="${classes.join(' ')}" ${clickAttr} style="margin-top:${-liftPx}px;">
      ${isActive && alive ? '<div class="active-tag">Agindo agora</div>' : ''}
      ${stickFigureSVG(c, alive)}
      <div class="fn">${c.name} <span class="badge rank-${c.rank}" style="font-size:8px; padding:1px 5px;">${c.rank}</span></div>
      <div class="fa">${ELEMENT_ICON[c.element]||''} ${c.anime}</div>
      <div class="hpbar"><div class="hpbar-fill" style="width:${alive?pct:0}%;"></div></div>
      <div class="hp-txt">${alive?hp:0}/${maxHp} HP ${isStunned&&alive?'· atordoado':''}${hasDot&&alive?' · '+hasDot.source:''}</div>
      <div class="shield-mini"><span>🛡️F ${shields.phys}</span><span>🛡️M ${shields.mag}</span></div>
    </div>`;
}

function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))>>>0; }
  return h;
}

const SKIN_TONES = ["#f4c9a0","#e8b184","#d99a6c","#c17f4f","#a5673c","#8a4f2c"];
const HAIR_COLORS = ["#2b2320","#4a2f1c","#6b3a1e","#8a5a2b","#c99a3f","#3a2f4a","#7a2b34","#2f4a3a","#c9c9c9","#1a1a1a"];
const HAIR_STYLES = ["spiky","short","long","mohawk","bald"];
const OUTFIT_PALETTES = {
  physical: ["#c9432f","#a83421","#8a5a2b","#5a3a1e"],
  magic: ["#4a3a8a","#6a2b6b","#2b4a6a","#3a2f6a"],
  hybrid: ["#3a6a4a","#8a5a2b","#6a2b6b","#c9432f"]
};

function stickFigureSVG(c, alive){
  let skin, hairColor, hairStyle, outfit, outfit2;
  if(c.appearance){
    const ap = c.appearance;
    skin = !alive ? "#5a5c66" : ap.skin;
    hairColor = !alive ? "#3a3c46" : ap.hairColor;
    hairStyle = ap.hairStyle;
    outfit = !alive ? "#4a4d57" : ap.outfit;
    outfit2 = !alive ? "#3a3c46" : (ap.outfit2 || shadeColor(ap.outfit,-18));
  } else {
    // Fallback for any character missing curated appearance data (shouldn't normally happen)
    const h = hashStr(c.id+c.name);
    skin = !alive ? "#5a5c66" : SKIN_TONES[h%SKIN_TONES.length];
    hairColor = !alive ? "#3a3c46" : HAIR_COLORS[(h>>>3)%HAIR_COLORS.length];
    hairStyle = HAIR_STYLES[(h>>>6)%HAIR_STYLES.length];
    const palette = OUTFIT_PALETTES[c.type] || OUTFIT_PALETTES.hybrid;
    outfit = !alive ? "#4a4d57" : palette[(h>>>9)%palette.length];
    outfit2 = !alive ? "#3a3c46" : shadeColor(outfit, -18);
  }

  let hairSVG = "";
  if(hairStyle==="spiky") hairSVG = `<path d="M13 6 L10 -1 L15 4 L18 -3 L20 4 L22 -3 L25 4 L30 -1 L27 6 Z" fill="${hairColor}"/>`;
  else if(hairStyle==="short") hairSVG = `<path d="M12 8 Q20 -2 28 8 L28 5 Q20 0 12 5 Z" fill="${hairColor}"/>`;
  else if(hairStyle==="long") hairSVG = `<path d="M12 7 Q20 -2 28 7 L29 22 L25 22 L25 9 Q20 4 15 9 L15 22 L11 22 Z" fill="${hairColor}"/>`;
  else if(hairStyle==="mohawk") hairSVG = `<path d="M17 6 Q20 -6 23 6 Z" fill="${hairColor}"/>`;

  return `<svg class="stick" width="40" height="52" viewBox="0 0 40 52">
    <circle cx="20" cy="10" r="7" fill="${skin}"/>
    ${hairSVG}
    <path d="M13 19 L27 19 L25 33 L15 33 Z" fill="${outfit}"/>
    <line x1="20" y1="21" x2="9" y2="30" stroke="${outfit}" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="21" x2="31" y2="30" stroke="${outfit}" stroke-width="4" stroke-linecap="round"/>
    <line x1="17" y1="33" x2="11" y2="48" stroke="${outfit2}" stroke-width="4" stroke-linecap="round"/>
    <line x1="23" y1="33" x2="29" y2="48" stroke="${outfit2}" stroke-width="4" stroke-linecap="round"/>
    ${!alive?'<line x1="12" y1="4" x2="28" y2="18" stroke="#d1495b" stroke-width="2.5"/><line x1="28" y1="4" x2="12" y2="18" stroke="#d1495b" stroke-width="2.5"/>':''}
  </svg>`;
}

function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function selectAttack(i){
  pendingAttackIdx = i;
  render();
}
function cancelSelection(){
  pendingAttackIdx=null;
  render();
}

async function executeSelfAction(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  const attackerId = getActiveId(state, myKey);
  applyAction(state, attackerId, pendingAttackIdx, null);
  await postAction(state);
}
async function selectTarget(targetId){
  if(pendingAttackIdx==null) return;
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  const attackerId = getActiveId(state, myKey);
  applyAction(state, attackerId, pendingAttackIdx, targetId);
  await postAction(state);
}

async function postAction(state){
  pendingAttackIdx=null;
  const p1Alive = aliveIds(state,"p1").length>0;
  const p2Alive = aliveIds(state,"p2").length>0;
  if(!p1Alive || !p2Alive){
    state.phase="battleover";
    state.winner = p1Alive ? "p1" : "p2";
  }
  await commitAndDraw(state);
}

function applyAction(state, attackerId, atkIdx, targetId){
  const c = charById(attackerId);
  const atk = c.attacks[atkIdx];
  const b = state.battle;
  for(let i=0;i<4;i++){ if(b.cooldowns[attackerId][i]>0) b.cooldowns[attackerId][i]--; }
  if(b.cooldowns[attackerId][atkIdx]>0 || (atk.onceOnly && b.onceUsed[attackerId][atkIdx])){
    b.log.unshift(`${c.name} tentou usar ${atk.name}, mas ainda não está pronto.`);
  } else {
    if(atk.dmg>0 && targetId){
      const tgt = charById(targetId);
      const shieldKey = atk.dmgType==="physical"?"phys":"mag";
      const shieldVal = b.shields[targetId][shieldKey];
      const dmg = Math.max(1, (atk.dmg + (b.dmgBonus[attackerId]||0)) - shieldVal);
      b.hp[targetId] = Math.max(0, b.hp[targetId]-dmg);
      b.log.unshift(`${c.name} usou ${atk.name} em ${tgt.name}: ${dmg} de dano.`);
      if(b.hp[targetId]<=0) b.log.unshift(`${tgt.name} foi derrotado!`);
    }
    if(atk.effect){
      if(atk.effect.type==="shield"){
        b.shields[attackerId].phys += atk.effect.value;
        b.shields[attackerId].mag += atk.effect.value;
        b.log.unshift(`${c.name} reforça a defesa (+${atk.effect.value}).`);
      } else if(atk.effect.type==="heal"){
        const cap = maxLifeOf(state, attackerId);
        b.hp[attackerId] = Math.min(cap, b.hp[attackerId]+atk.effect.value);
        b.log.unshift(`${c.name} recupera ${atk.effect.value} de vida.`);
      } else if(atk.effect.type==="debuff" && targetId){
        const tgt = charById(targetId);
        const shieldKey = atk.dmgType==="physical"?"phys":"mag";
        b.shields[targetId][shieldKey] = Math.max(0, b.shields[targetId][shieldKey]-atk.effect.value);
        b.log.unshift(`${tgt.name} teve o escudo reduzido em ${atk.effect.value}.`);
      } else if(atk.effect.type==="stun" && targetId){
        const tgt = charById(targetId);
        b.stunned[targetId]=true;
        b.log.unshift(`${tgt.name} ficou atordoado!`);
      } else if(atk.effect.type==="dot" && targetId){
        const tgt = charById(targetId);
        b.dot[targetId] = {value: atk.effect.value, turnsLeft: 2, source: atk.dmgType==="physical"?"Sangramento":(c.element==="Fogo"?"Queimadura":c.element==="Venenoso"?"Veneno":"Efeito contínuo")};
        b.log.unshift(`${tgt.name} sofre ${b.dot[targetId].source.toLowerCase()} (${atk.effect.value} de dano por turno)!`);
      }
    }
    if(atk.cooldown>0) b.cooldowns[attackerId][atkIdx]=atk.cooldown;
    if(atk.onceOnly) b.onceUsed[attackerId][atkIdx]=true;
  }
  b.stunned[attackerId]=false;

  // Tick any active damage-over-time effects (queimadura/veneno) once per global turn.
  Object.keys(b.dot).forEach(id=>{
    if(b.hp[id]<=0){ delete b.dot[id]; return; }
    const d = b.dot[id];
    const dTgt = charById(id);
    b.hp[id] = Math.max(0, b.hp[id]-d.value);
    b.log.unshift(`${dTgt.name} perde ${d.value} de vida por ${d.source.toLowerCase()}.`);
    if(b.hp[id]<=0) b.log.unshift(`${dTgt.name} foi derrotado pelo ${d.source.toLowerCase()}!`);
    d.turnsLeft -= 1;
    if(d.turnsLeft<=0) delete b.dot[id];
  });

  // Advance this side's order cursor past whoever just acted, then hand the turn
  // over — resolving any stun-skips on the way (this is what keeps stun from
  // ever getting permanently stuck).
  const actingKey = teamOf(state, attackerId);
  const pos = state.attackOrder[actingKey].indexOf(attackerId);
  b.orderIndex[actingKey] = (pos+1) % state.attackOrder[actingKey].length;
  state.battle.currentTurn = actingKey==="p1" ? "p2" : "p1";
  resolveStunSkipsAndAdvance(state);
}

async function useUltimate(){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  const ultId = state.ultimateChoice[myKey];
  const activeId = getActiveId(state, myKey);
  if(!ultId || ultId!==activeId || state.battle.ultimateUsed[ultId]) return;
  const c = charById(ultId);
  const b = state.battle;
  b.maxLifeBonus[ultId] = c.ultimate.lifeBonus;
  b.hp[ultId] = Math.min(maxLifeOf(state,ultId), b.hp[ultId]+c.ultimate.lifeBonus);
  b.dmgBonus[ultId] = c.ultimate.dmgBonus;
  b.ultimateUsed[ultId]=true;
  b.log.unshift(`${c.name} ativa o Ultimate: ${c.ultimate.name}!`);
  const pos = state.attackOrder[myKey].indexOf(ultId);
  b.orderIndex[myKey] = (pos+1) % state.attackOrder[myKey].length;
  state.battle.currentTurn = MY_SLOT===1?"p2":"p1";
  resolveStunSkipsAndAdvance(state);
  await postAction(state);
}

function renderBattleOver(state){
  const winner = state.winner;
  app.innerHTML = `
    <div class="eyebrow">Fim de jogo</div>
    <h1>${playerName(state,winner)} venceu a batalha!</h1>
    <div class="card">
      <div class="log">${state.battle.log.slice(0,20).map(l=>`<div>${l}</div>`).join("")}</div>
    </div>
    <div class="center"><button class="btn primary" onclick="location.reload()">Jogar novamente</button></div>
  `;
}

function renderDone(state){
  app.innerHTML = `
    <div class="eyebrow">Times prontos</div>
    <h1>Equipes finais</h1>
    <div class="players-grid">
      ${[1,2].map(slot=>{
        const key="p"+slot;
        const team = state.teams[key].map(id=>charById(id));
        const ultId = state.ultimateChoice[key];
        return `<div class="player-panel">
          <h3>Jogador ${slot} <span class="money">R$${state.budget[key]} restante</span></h3>
          ${team.map(c=>`
            <div class="mini-card" style="margin-top:8px;">
              <div class="mn">${c.name} ${ultId===c.id?'<span class="badge ult">Ultimate ativo</span>':''}</div>
              <div class="ma">${c.anime} · Vida ${c.life}</div>
            </div>`).join("")}
        </div>`;
      }).join("")}
    </div>
    <p class="hint center">Times completos! Usem essas fichas pra jogar a batalha (turno a turno, respeitando cooldowns, tipos de dano e habilidades de uso único) — igual ao formato que vocês já vinham jogando no chat.</p>
  `;
}

render();
</script>
