/* ============ MOTOR DE BATALHA ============
   TURNOS SIMULTÂNEOS: os dois jogadores escolhem a ação (atacar, trocar, ou
   Ultimate quando for do tipo que usa o turno) sem ver o que o outro escolheu.
   Só quando os DOIS têm uma ação pendente é que o turno resolve — e resolve na
   ordem de VELOCIDADE do personagem que está agindo (quem troca age com a
   velocidade de quem ENTRA, já que é ele quem golpeia). Ver `pending` no estado
   e `resolveTurn()` mais abaixo. Não existe mais "vez de fulano". */
function initBattle(state){
  const primeiroP1 = state.attackOrder.p1[0], primeiroP2 = state.attackOrder.p2[0];
  const battle = {
    pending: {p1:null, p2:null},
    activeChar: {p1: primeiroP1, p2: primeiroP2},
    mustSwitch: {p1:false, p2:false},
    hp:{}, cooldowns:{}, onceUsed:{}, stunned:{}, def:{}, tempDef:{}, atkBonus:{},
    maxLifeBonus:{}, ultimateUsed:{}, transformed:{}, dot:{},
    growOnHit:{}, transformActive:{}, stunImmune:{}, selfRecoil:{},
    log:["A batalha começou!"]
  };
  [...state.teams.p1, ...state.teams.p2].forEach(id=>{
    const c = charById(id);
    battle.hp[id]=c.vida;
    battle.def[id]={fis:c.defFis, mag:c.defMag};
    battle.cooldowns[id]=[0,0,0,0];
    battle.onceUsed[id]=[false,false,false,false];
    battle.stunned[id]=false;
    battle.atkBonus[id]=0;
    battle.maxLifeBonus[id]=0;
  });
  const vp1 = charById(primeiroP1).vel, vp2 = charById(primeiroP2).vel;
  if(vp1!==vp2) battle.log.unshift(`${charById(vp1>vp2?primeiroP1:primeiroP2).name} é mais rápido e tende a agir primeiro.`);
  return battle;
}

/* Desempate de velocidade: cai no resultado da moeda, pra ficar determinístico
   e igual nos dois clientes mesmo com empate exato. */
function tiebreak(state){
  return (state.coinResult==="p1" || state.coinResult==="p2") ? state.coinResult : "p1";
}

/* ---------- atributos efetivos em combate ---------- */
function atkStat(state, id, dmgType){
  const c = charById(id);
  const base = dmgType==="physical" ? c.atkFis : c.atkMag;
  return Math.max(1, base + (state.battle.atkBonus[id]||0));
}
function defStat(state, id, dmgType){
  const b = state.battle;
  const k = dmgType==="physical" ? "fis" : "mag";
  const temp = (b.tempDef && b.tempDef[id] && b.tempDef[id][k]) || 0;
  return Math.max(0, b.def[id][k] + temp);
}

/* DANO
     Bruto = Ataque x (Poder da Habilidade / 100)
     Final = Bruto x (100 / (100 + Defesa))
   A defesa deixou de ser subtração e virou divisor: ela agora reduz uma FRAÇÃO
   do dano, então nunca zera um golpe nem deixa de importar contra golpes fortes. */
function calcDano(state, attackerId, targetId, atk){
  const a = atkStat(state, attackerId, atk.dmgType);
  const d = defStat(state, targetId, atk.dmgType);
  const bruto = a * ((atk.power||0)/100);
  return Math.max(1, Math.round(bruto * (100/(100+d))));
}

/* ESQUIVA E PRECISÃO
   Quem é mais rápido esquiva de quem é mais lento: o dobro da velocidade dá 25%.
   A chance de errar soma a esquiva do alvo com o que falta pra precisão do golpe
   chegar a 100 — e o total nunca passa de 60%, senão golpes fortes viraria loteria. */
const MAX_MISS = 60;
function chanceEsquiva(state, attackerId, targetId){
  const va = charById(attackerId).vel, vt = charById(targetId).vel;
  if(vt <= va) return 0;
  return Math.min(MAX_MISS, ((vt/va) - 1) * 25);
}
function chanceErro(state, attackerId, targetId, atk){
  const falta = 100 - (atk.precision===undefined ? 100 : atk.precision);
  return Math.min(MAX_MISS, chanceEsquiva(state, attackerId, targetId) + falta);
}

function checkDeathPenalty(state, id, wasAliveBefore){}

// Alguns Ultimates (o do Garou) fazem o personagem crescer conforme apanha, até um teto.
function checkGrowOnHit(state, id, wasAliveBefore){
  const b = state.battle;
  if(!b.growOnHit || !b.growOnHit[id]) return;
  if(!wasAliveBefore || b.hp[id]<=0) return;
  const g = b.growOnHit[id];
  if(g.current >= g.cap) return;
  const gain = Math.min(g.perHit, g.cap-g.current);
  g.current += gain;
  b.atkBonus[id] = (b.atkBonus[id]||0) + gain;
  const c = charById(id);
  b.log.unshift(`${c.name} fica mais forte ao apanhar! (+${gain} de dano, ${g.current}/${g.cap} acumulado)`);
}

// O outro lado da mecânica do Garou: se ele cair carregado, o poder explode no próprio time.
function checkExplodeOnDeath(state, id, wasAliveBefore){
  const b = state.battle;
  if(!wasAliveBefore || b.hp[id]>0) return;
  const c = charById(id);
  if(!c.ultimate || !c.ultimate.explodeOnDeath) return;
  const grow = b.growOnHit && b.growOnHit[id];
  if(!grow || grow.current<=0) return;
  const dmg = Math.max(1, Math.round(grow.current*0.5));
  const myKey = teamOf(state, id);
  state.teams[myKey].filter(allyId=>allyId!==id && b.hp[allyId]>0).forEach(allyId=>{
    const ally = charById(allyId);
    const wasAllyAlive = b.hp[allyId]>0;
    b.hp[allyId] = Math.max(0, b.hp[allyId]-dmg);
    b.log.unshift(`A energia acumulada de ${c.name} explode ao cair e atinge ${ally.name} em ${dmg} de dano!`);
    checkDeathPenalty(state, allyId, wasAllyAlive);
    if(b.hp[allyId]<=0) b.log.unshift(`${ally.name} foi derrotado pela explosão!`);
  });
}

function tickSelfRecoil(state, id){
  const b = state.battle;
  if(!b.selfRecoil || !b.selfRecoil[id]) return;
  const r = b.selfRecoil[id];
  const wasAlive = b.hp[id]>0;
  b.hp[id] = Math.max(0, b.hp[id]-r.value);
  const c = charById(id);
  b.log.unshift(`${c.name} sofre ${r.value} de dano pelo esforço da transformação.`);
  checkDeathPenalty(state, id, wasAlive);
  checkExplodeOnDeath(state, id, wasAlive);
  r.turnsLeft -= 1;
  if(r.turnsLeft<=0 || b.hp[id]<=0) delete b.selfRecoil[id];
}

// Conta as rodadas DO PRÓPRIO personagem transformado. Ao acabar, tudo reverte
// junto: vida bônus, dano bônus (incluindo o acúmulo estilo Garou) e o corte de defesa.
function tickTransformDuration(state, id){
  const b = state.battle;
  if(!b.transformActive || !b.transformActive[id]) return;
  const t = b.transformActive[id];
  t.turnsLeft -= 1;
  if(t.turnsLeft<=0){
    b.def[id].fis = t.original.fis;
    b.def[id].mag = t.original.mag;
    b.atkBonus[id] = 0;
    b.maxLifeBonus[id] = 0;
    b.hp[id] = Math.min(b.hp[id], maxLifeOf(state,id));
    b.transformed[id] = false;
    if(b.growOnHit) delete b.growOnHit[id];
    const c = charById(id);
    b.log.unshift(`A transformação de ${c.name} termina — tudo volta ao normal.`);
    delete b.transformActive[id];
  }
}

function tickStunImmunity(state, id){
  const b = state.battle;
  if(!b.stunImmune || !b.stunImmune[id]) return;
  b.stunImmune[id].turnsLeft -= 1;
  if(b.stunImmune[id].turnsLeft<=0){
    delete b.stunImmune[id];
    const c = charById(id);
    b.log.unshift(`${c.name} não está mais imune a atordoamento.`);
  }
}

const ELEMENT_ICON = {
  Fogo:"🔥", Gelo:"❄️", "Elétrico":"⚡", Sombrio:"🌑", Sagrado:"✨", Venenoso:"☠️",
  Espiritual:"👻", "Psíquico":"🌀", Vento:"🌪️", Terra:"🪨", "Água":"💧", Metal:"⚙️", Natureza:"🌿", Normal:"◽"
};

const ELEMENT_GLOW = {
  Fogo:"#e05a2d", Gelo:"#6fb3d9", "Elétrico":"#e0b559", Sombrio:"#8a5fd4", Sagrado:"#f0d98a",
  Venenoso:"#4fbf63", Espiritual:"#a68fe0", "Psíquico":"#e078a8", Vento:"#3fc4b4", Terra:"#c48a52",
  "Água":"#4a9be0", Metal:"#c9c9c9", Natureza:"#4fbf63", Normal:"#e0b559"
};

// Cada elemento tem uma FORMA de partícula, não só uma cor: raio vira risco,
// gelo e metal viram cacos, o resto vira partícula redonda. É o que faz um
// Zoltraak parecer diferente de um Thunderbolt sem precisar de sprite de efeito.
function fxShapeFor(element, dmgType){
  if(element==="Elétrico") return "bolt";
  if(element==="Gelo" || element==="Metal") return "shard";
  if(dmgType==="physical" && (element==="Normal")) return "slash";
  return "dot";
}

function activeIdOf(state, key){ return state.battle.activeChar[key]; }

/* Velocidade de quem vai agir NESTE turno: se a ação é trocar, é a velocidade
   de quem ENTRA (é ele que golpeia); se é atacar/Ultimate, é a de quem já
   está em campo. */
function actorSpeed(state, key, action){
  if(action.type==="switch") return charById(action.charId).vel;
  return charById(state.battle.activeChar[key]).vel;
}

function actorIdFor(state, key, action){
  return action.type==="switch" ? action.charId : state.battle.activeChar[key];
}

/* Só resolve quando os DOIS têm ação pendente e ninguém está preso numa troca
   forçada (personagem caído sem substituto escolhido ainda). Devolve true se
   resolveu algo — quem chama salva o estado só nesse caso. */
function maybeResolveTurn(state){
  const b = state.battle;
  if(!b || !b.pending) return false;
  if(b.mustSwitch && (b.mustSwitch.p1 || b.mustSwitch.p2)) return false;
  if(!b.pending.p1 || !b.pending.p2) return false;

  const acoes = [
    {key:"p1", action:b.pending.p1},
    {key:"p2", action:b.pending.p2}
  ];
  b.pending = {p1:null, p2:null};

  const spds = acoes.map(a=>actorSpeed(state,a.key,a.action));
  let ordem = spds[0]>=spds[1] ? [0,1] : [1,0];
  if(spds[0]===spds[1] && tiebreak(state)!==acoes[0].key) ordem = [1,0];

  for(const i of ordem){
    const {key, action} = acoes[i];
    // Se o lutador ativo desse jogador já morreu na ação anterior deste mesmo
    // turno, ele não age — mustSwitch cuida disso na próxima rodada.
    const atorId = actorIdFor(state, key, action);
    if(action.type!=="switch" && state.battle.hp[state.battle.activeChar[key]]<=0) continue;
    executeAction(state, key, action);
  }
  checkForcedSwitch(state);
  return true;
}

/* Executa UMA ação de UM jogador dentro da resolução do turno. */
function executeAction(state, key, action){
  const b = state.battle;
  const activeId = b.activeChar[key];
  if(action.type==="attack"){
    if(b.hp[activeId]<=0) return;
    if(b.stunned[activeId]){
      const c = charById(activeId);
      b.log.unshift(`${c.name} estava atordoado e perdeu a vez.`);
      b.stunned[activeId] = false;
      tickStunImmunity(state, activeId);
      return;
    }
    const oppKey = otherKey(key);
    applyAction(state, activeId, action.atkIndex, b.activeChar[oppKey]);
  } else if(action.type==="switch"){
    executeSwitchAction(state, key, action.charId);
  } else if(action.type==="ultimate"){
    if(b.hp[activeId]<=0) return;
    if(b.stunned[activeId]){
      const c = charById(activeId);
      b.log.unshift(`${c.name} estava atordoado e não conseguiu ativar o Ultimate.`);
      b.stunned[activeId] = false;
      tickStunImmunity(state, activeId);
      return;
    }
    executeMeteorUltimate(state, activeId);
  }
}

/* Troca VOLUNTÁRIA (o personagem antigo ainda está vivo). Quem entra golpeia
   na hora: 5 fixo + 5% do maior atributo de ataque dele, ignorando defesa e
   chance de erro — é o "preço de entrada" que torna a troca uma ação de
   verdade, e não só uma pausa grátis. */
function entryAttackDamage(c){
  return Math.max(1, Math.round(5 + 0.05*Math.max(c.atkFis, c.atkMag)));
}
function executeSwitchAction(state, key, newId){
  const b = state.battle;
  const oldId = b.activeChar[key];
  if(b.hp[newId]<=0 || newId===oldId) return; // alvo inválido — não desperdiça a ação
  const oldC = charById(oldId), newC = charById(newId);
  b.activeChar[key] = newId;
  b.log.unshift(`${playerName(state,key)} troca ${oldC.name} por ${newC.name}!`);

  const oppKey = otherKey(key);
  const targetId = b.activeChar[oppKey];
  if(targetId && b.hp[targetId]>0){
    const dmg = entryAttackDamage(newC);
    const wasAlive = b.hp[targetId]>0;
    b.hp[targetId] = Math.max(0, b.hp[targetId]-dmg);
    const tgt = charById(targetId);
    b.log.unshift(`${newC.name} entra atacando ${tgt.name}: ${dmg} de dano.`);
    checkDeathPenalty(state, targetId, wasAlive);
    checkGrowOnHit(state, targetId, wasAlive);
    checkExplodeOnDeath(state, targetId, wasAlive);
    if(!b.lastFx) b.lastFx = {nonce:0, effects:[]};
    b.lastFx = {nonce: nextFxNonce(b), attackerId:newId,
                effects:[{targetId, kind:"hit", color:ELEMENT_GLOW[newC.element]||"#e0b559",
                          shape:fxShapeFor(newC.element,"physical"), value:dmg}]};
    if(b.hp[targetId]<=0) b.log.unshift(`${tgt.name} foi derrotado!`);
  }
}

function checkForcedSwitch(state){
  ["p1","p2"].forEach(key=>{
    const activeId = state.battle.activeChar[key];
    if(state.battle.hp[activeId]<=0){
      const bench = state.teams[key].filter(id=>id!==activeId && state.battle.hp[id]>0);
      if(bench.length>0){
        if(!state.battle.mustSwitch) state.battle.mustSwitch={p1:false,p2:false};
        state.battle.mustSwitch[key]=true;
      }
    }
  });
}

function maxLifeOf(state, id){
  const c = charById(id);
  return c.vida + (state.battle.maxLifeBonus[id]||0);
}
function teamOf(state,id){ return state.teams.p1.includes(id) ? "p1" : "p2"; }
function aliveIds(state, key){ return state.teams[key].filter(id=>state.battle.hp[id]>0); }

/* ============ RENDER DA BATALHA ============ */
let lastActiveSeen = {p1:null, p2:null};

function hpClass(pct){ return pct>55 ? "hp-high" : pct>25 ? "hp-mid" : "hp-low"; }

function hudFor(state, id, side){
  const c = charById(id);
  const b = state.battle;
  const hp = Math.max(0,b.hp[id]);
  const maxHp = maxLifeOf(state,id);
  const pct = Math.max(0,Math.round((hp/maxHp)*100));
  const tag = (t)=> `<span class="hud-tag">${t}</span>`;
  let tags = tag(`🛡️F ${defStat(state,id,"physical")}`)
           + tag(`🛡️M ${defStat(state,id,"magic")}`)
           + tag(`⚡ ${c.vel}`);
  if(b.stunned[id] && hp>0) tags += tag("💫 atordoado");
  if(b.dot && b.dot[id] && hp>0) tags += tag("🔥 "+b.dot[id].source);
  if(b.stunImmune && b.stunImmune[id] && hp>0) tags += tag("🔰 "+b.stunImmune[id].turnsLeft);
  if(b.transformed && b.transformed[id] && hp>0) tags += tag("✨ transformado");
  return `
    <div class="hud hud-${side}">
      <div class="hud-top">
        <span class="hud-name">${c.name}</span>
        <span class="hud-hp-num">${hp}/${maxHp}</span>
      </div>
      <div class="hud-bar"><div class="hud-bar-fill ${hpClass(pct)}" style="width:${pct}%"></div></div>
      <div class="hud-tags">${tags}</div>
    </div>`;
}

function stageFighter(state, id, side){
  const c = charById(id);
  const b = state.battle;
  const alive = b.hp[id]>0;
  const isPlayer = side==="player";
  const view = isPlayer ? "back" : "front";
  const transformed = !!(b.transformed && b.transformed[id]);
  const entering = lastActiveSeen[isPlayer?"me":"opp"] !== id;
  const glow = ELEMENT_GLOW[c.element] || "#e0b559";

  const auraHTML = (transformed && alive) ? `
    <div class="sprite-aura" style="--aura:${glow};"></div>
    <div class="aura-spark" style="--aura:${glow}; left:12%; bottom:8%; animation-delay:0s;"></div>
    <div class="aura-spark" style="--aura:${glow}; left:78%; bottom:14%; animation-delay:.35s;"></div>
    <div class="aura-spark" style="--aura:${glow}; left:46%; bottom:2%; animation-delay:.7s;"></div>` : "";

  const boxCls = [
    alive ? "" : "anim-ko",
    entering && alive ? (isPlayer?"anim-enter-player":"anim-enter-enemy") : ""
  ].join(" ");

  return `
    <div class="stage-slot slot-${isPlayer?'player':'enemy'}" data-fighter-id="${id}">
      <div class="sprite-box ${boxCls}">
        ${auraHTML}
        ${fighterArt(c,{view, transformed, alive, className:(isPlayer?'sprite-player':'sprite-enemy')+(alive?' anim-idle':'')})}
      </div>
    </div>`;
}

function renderBattle(state){

  const oppMustSwitch = b.mustSwitch && b.mustSwitch[oppKey];

  const oppActiveId = b.activeChar[oppKey];

  const oppPending = b.pending && b.pending[oppKey];
  // Só posso escolher ação quando ninguém está preso numa troca forçada e eu
  // ainda não enviei a minha pra essa rodada.
  const podeEscolher = !myMustSwitch && !oppMustSwitch && !myPending && b.hp[myActiveId]>0;

  else if(oppMustSwitch) bannerText = `${playerName(state,oppKey)} precisa escolher um substituto...`;

  app.innerHTML = `
    <div class="eyebrow">Batalha 1x1</div>

      </div>

      ${myMustSwitch ? `<p class="hint center" style="margin-top:10px;">Toque em um lutador vivo nas suas reservas pra mandar pro campo.</p>` : ''}

      <div class="action-panel">
        <h3>${attackerChar.name} <span class="badge rank-${attackerChar.rankKey}">${attackerChar.rank}</span> ${isTransformed?'<span class="badge ult">✨ Transformado</span>':''}</h3>
        <p class="hint" style="margin-top:-6px; margin-bottom:10px;">${attackerChar.class} · <span class="badge element-${attackerChar.element}">${ELEMENT_ICON[attackerChar.element]||''} ${attackerChar.element}</span>
          ${(()=>{ const e=Math.round(chanceEsquiva(state,myActiveId,oppActiveId));
            return e>0 ? ` · ⚡ ${charById(oppActiveId).name} desvia +${e}% (mais rápido)` : ''; })()}
        </p>
        <div class="atk-list">
          ${attackerChar.attacks.map((a,i)=>{

    </div>
  `;
  lastActiveSeen = {me: myActiveId, opp: oppActiveId};
  // Puxa a arte dos dois que estão em campo antes que ela seja necessária.
  preloadArt(charById(myActiveId));
  preloadArt(charById(oppActiveId));
  triggerBattleFx(state);
}

// mode: 'none' | 'voluntary' (troca com contra-ataque de entrada) | 'forced' (substituição obrigatória, grátis)
function duelMiniCard(state, id, sideKey, mode){
  const c = charById(id);
  const hp = state.battle.hp[id];
  const alive = hp>0;
  const maxHp = maxLifeOf(state,id);
  const pct = Math.max(0,Math.round((hp/maxHp)*100));
  const isActiveHere = state.battle.activeChar[sideKey]===id;
  const clickable = mode!=="none" && alive && !isActiveHere;
  const classes = ["duel-mini"];
  if(!alive) classes.push("dead");
  if(isActiveHere) classes.push("active");
  if(clickable) classes.push("switchable");
  const onclick = mode==="forced" ? `doForcedSwitch('${id}')` : `submitAction({type:'switch',charId:'${id}'})`;
  const clickAttr = clickable ? `onclick="${onclick}"` : "";
  return `<div class="${classes.join(' ')}" ${clickAttr} data-fighter-id="${id}" title="${c.name}">
    ${fighterArt(c,{view:"front", alive, transformed: state.battle.transformed && state.battle.transformed[id]})}
    <div class="duel-mini-hp"><div class="duel-mini-hp-fill" style="width:${alive?pct:0}%"></div></div>
  </div>`;
}

/* ---------- camada de efeitos ---------- */
let lastFxNonce = null;
const CHARGE_MS = 1900;      // duração da fase de carga de ki
const TRANSFORM_MS = 3400;   // duração total (a faixa do título é a mais longa)
let animLock = 0;            // enquanto travado, o polling não redesenha

function boxCenter(stageRect, id){
  const el = app.querySelector(`.stage-slot[data-fighter-id="${id}"] .sprite-box`);
  if(!el) return null;
  const r = el.getBoundingClientRect();
  return {x: r.left - stageRect.left + r.width/2, y: r.top - stageRect.top + r.height/2, el};
}

function spawnHitFx(layer, pos, color, shape){
  const anchor = document.createElement("div");
  anchor.className = "fx-anchor";
  anchor.style.left = pos.x+"px";
  anchor.style.top = pos.y+"px";
  anchor.style.setProperty("--fx", color);

  const burst = document.createElement("div");
  burst.className = "fx-burst";
  anchor.appendChild(burst);

  if(shape==="slash"){
    const s = document.createElement("div");
    s.className = "fx-slash";
    anchor.appendChild(s);
  } else if(shape==="bolt"){
    for(let i=0;i<4;i++){
      const b = document.createElement("div");
      b.className = "fx-bolt";
      b.style.left = (-18+i*11)+"px";
      b.style.top = (-16+(i%2)*8)+"px";
      b.style.animationDelay = (i*0.05)+"s";
      anchor.appendChild(b);
    }
  } else {
    const n = shape==="shard" ? 7 : 9;
    for(let i=0;i<n;i++){
      const p = document.createElement("div");
      p.className = "fx-particle" + (shape==="shard"?" shard":"");
      const ang = (Math.PI*2*i)/n + Math.random()*0.4;
      const dist = 20+Math.random()*20;
      p.style.setProperty("--px", Math.cos(ang)*dist+"px");
      p.style.setProperty("--py", Math.sin(ang)*dist+"px");
      p.style.left="0px"; p.style.top="0px";
      p.style.animationDelay=(Math.random()*0.08)+"s";
      anchor.appendChild(p);
    }
  }
  layer.appendChild(anchor);
  setTimeout(()=>anchor.remove(), 900);
}

function spawnNumber(layer, pos, text, isHeal){
  const el = document.createElement("div");
  el.className = "fx-dmg" + (isHeal?" heal":"");
  el.textContent = text;
  el.style.left = pos.x+"px";
  el.style.top = (pos.y-14)+"px";
  layer.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

/* Animação de transformação em duas fases.
   Quando isso roda, o estado JÁ diz que o personagem está transformado, então a
   tela já desenhou a arte final. A animação portanto anda de trás pra frente:
   volta pra arte de carga, segura, e só então revela a arte que já estava lá.
   Como as 6 artes compartilham o mesmo canvas ancorado, trocar o src não desloca
   um pixel — a troca some dentro do clarão. */
function playTransformation(targetId, ultName){
  const stage = document.getElementById("battleStage");
  const layer = document.getElementById("fxLayer");
  const slot  = app.querySelector(`.stage-slot[data-fighter-id="${targetId}"]`);

  // A faixa do título aparece mesmo sem arte de carga — vale para qualquer
  // personagem com Ultimate de transformação, não só o Goku.
  if(ultName){
    const title = document.createElement("div");
    title.className = "ult-title";
    title.textContent = ultName;
    document.body.appendChild(title);
    setTimeout(()=>title.remove(), TRANSFORM_MS + 200);
  }
  if(!stage || !layer || !slot) return;

  const box = slot.querySelector(".sprite-box");
  const img = slot.querySelector(".sprite-img");
  const c   = charById(targetId);
  const view = slot.classList.contains("slot-player") ? "back" : "front";
  const charge = chargeBitmapFor(c, view);
  if(!charge || !img || !box) return;

  animLock = Date.now() + TRANSFORM_MS;

  const finalSrc = img.src;
  img.src = charge;
  box.classList.add("charging");
  stage.classList.add("stage-charging");

  const sr = stage.getBoundingClientRect();
  const r  = box.getBoundingClientRect();
  const glow = document.createElement("div");
  glow.className = "charge-glow";
  glow.style.setProperty("--gx", ((r.left-sr.left+r.width/2)/sr.width*100)+"%");
  glow.style.setProperty("--gy", ((r.top-sr.top+r.height/2)/sr.height*100)+"%");
  stage.appendChild(glow);

  const motes = setInterval(()=>{
    const m = document.createElement("div");
    m.className = "ki-mote";
    m.style.left = (r.left-sr.left + Math.random()*r.width)+"px";
    m.style.top  = (r.top-sr.top + r.height*(0.5+Math.random()*0.45))+"px";
    layer.appendChild(m);
    setTimeout(()=>m.remove(), 1100);
  }, 65);

  setTimeout(()=>{
    clearInterval(motes);
    glow.remove();
    stage.classList.remove("stage-charging");
    box.classList.remove("charging");
    img.src = finalSrc;
    const flash = document.createElement("div");
    flash.className = "stage-flash";
    flash.style.setProperty("--fx", "#ffffff");
    stage.appendChild(flash);
    stage.classList.add("stage-quake");
    setTimeout(()=>{ flash.remove(); stage.classList.remove("stage-quake"); }, 780);
  }, CHARGE_MS);
}

// Toca tudo que acabou de acontecer: avanço do atacante, impacto elemental no
// alvo, número flutuante e, no caso do Ultimate meteoro, clarão + tremor da arena.
function triggerBattleFx(state){
  const fx = state.battle && state.battle.lastFx;
  if(!fx || fx.nonce===lastFxNonce) return;
  lastFxNonce = fx.nonce;
  if(fx.kind==="transform"){ playTransformation(fx.targetId, fx.name); return; }
  const stage = document.getElementById("battleStage");
  const layer = document.getElementById("fxLayer");
  if(!stage || !layer) return;
  const sRect = stage.getBoundingClientRect();

  // avanço de quem atacou
  if(fx.attackerId){
    const a = boxCenter(sRect, fx.attackerId);
    if(a){
      const isMine = fx.attackerId === state.battle.activeChar["p"+MY_SLOT];
      a.el.classList.add(isMine ? "anim-attack-player" : "anim-attack-enemy");
      setTimeout(()=>a.el.classList.remove("anim-attack-player","anim-attack-enemy"), 520);
    }
  }

  if(fx.meteor){
    const flash = document.createElement("div");
    flash.className = "stage-flash";
    flash.style.setProperty("--fx", fx.color || "#e0b559");
    stage.appendChild(flash);
    stage.classList.add("stage-quake");
    setTimeout(()=>{ flash.remove(); stage.classList.remove("stage-quake"); }, 750);
    for(let i=0;i<5;i++){
      const m = document.createElement("div");
      m.className = "meteor-streak";
      m.style.setProperty("--fx", fx.color || "#e0b559");
      m.style.left = (10+i*19)+"%";
      m.style.animationDelay = (i*0.07)+"s";
      layer.appendChild(m);
      setTimeout(()=>m.remove(), 900);
    }
  }

  (fx.effects||[]).forEach((e, i)=>{
    setTimeout(()=>{
      const pos = boxCenter(sRect, e.targetId);
      if(!pos) return;
      if(e.kind==="hit"){
        spawnHitFx(layer, pos, e.color, e.shape);
        pos.el.classList.add("anim-hit");
        setTimeout(()=>pos.el.classList.remove("anim-hit"), 440);
        if(e.value) spawnNumber(layer, pos, "-"+e.value, false);
      } else if(e.kind==="heal"){
        spawnHitFx(layer, pos, "#5fd07a", "dot");
        if(e.value) spawnNumber(layer, pos, "+"+e.value, true);
      } else if(e.kind==="shield"){
        spawnHitFx(layer, pos, "#8fc0ff", "dot");
      } else if(e.kind==="stun"){
        spawnHitFx(layer, pos, "#e078a8", "bolt");
      }
    }, fx.attackerId ? 190 + i*40 : i*40);
  });
}

/* ---------- stick figure (fallback dos 134 sem pixel art) ---------- */
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))>>>0; }
  return h;
}
const SKIN_TONES = ["#f4c9a0","#e8b184","#d99a6c","#c17f4f","#a5673c","#8a4f2c"];
const HAIR_COLORS = ["#2b2320","#4a2f1c","#6b3a1e","#8a5a2b","#c99a3f","#3a2f4a","#7a2b34","#2f4a3a","#c9c9c9","#1a1a1a"];
const HAIR_STYLES = ["spiky","short","long","mohawk","bald"];
const OUTFIT_PALETTES = {
  physical: ["#c9432f","#a83421","#8a5a2b","#5a3a1e"],
  magic: ["#4a3a8a","#6a2b6b","#2b4a6a","#3a2f6a"],
  hybrid: ["#3a6a4a","#8a5a2b","#6a2b6b","#c9432f"]
};

function stickFigureSVG(c, alive, transformed){
  let skin, hairColor, hairStyle, outfit, outfit2;
  if(c.appearance){
    const ap = c.appearance;
    skin = !alive ? "#5a5c66" : ap.skin;
    hairColor = !alive ? "#3a3c46" : ap.hairColor;
    hairStyle = ap.hairStyle;
    outfit = !alive ? "#4a4d57" : ap.outfit;
    outfit2 = !alive ? "#3a3c46" : (ap.outfit2 || shadeColor(ap.outfit,-18));
  } else {
    const h = hashStr(c.id+c.name);
    skin = !alive ? "#5a5c66" : SKIN_TONES[h%SKIN_TONES.length];
    hairColor = !alive ? "#3a3c46" : HAIR_COLORS[(h>>>3)%HAIR_COLORS.length];
    hairStyle = HAIR_STYLES[(h>>>6)%HAIR_STYLES.length];
    const palette = OUTFIT_PALETTES[c.type] || OUTFIT_PALETTES.hybrid;
    outfit = !alive ? "#4a4d57" : palette[(h>>>9)%palette.length];
    outfit2 = !alive ? "#3a3c46" : shadeColor(outfit, -18);
  }

  let auraSVG = "";
  if(transformed && alive){
    const glow = ELEMENT_GLOW[c.element] || "#e0b559";
    auraSVG = `
      <circle cx="20" cy="24" r="25" fill="${glow}" opacity="0.10"/>
      <circle cx="20" cy="24" r="19" fill="${glow}" opacity="0.16"/>
      <circle cx="20" cy="24" r="13" fill="${glow}" opacity="0.14"/>
      <line x1="3" y1="7" x2="9" y2="13" stroke="${glow}" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="37" y1="7" x2="31" y2="13" stroke="${glow}" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="3" y1="41" x2="9" y2="35" stroke="${glow}" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="37" y1="41" x2="31" y2="35" stroke="${glow}" stroke-width="2" stroke-linecap="round" opacity="0.85"/>`;
    hairColor = shadeColor(hairColor, 70);
  }

  let hairSVG = "";
  if(hairStyle==="spiky") hairSVG = `<path d="M13 6 L10 -1 L15 4 L18 -3 L20 4 L22 -3 L25 4 L30 -1 L27 6 Z" fill="${hairColor}"/>`;
  else if(hairStyle==="short") hairSVG = `<path d="M12 8 Q20 -2 28 8 L28 5 Q20 0 12 5 Z" fill="${hairColor}"/>`;
  else if(hairStyle==="long") hairSVG = `<path d="M12 7 Q20 -2 28 7 L29 22 L25 22 L25 9 Q20 4 15 9 L15 22 L11 22 Z" fill="${hairColor}"/>`;
  else if(hairStyle==="mohawk") hairSVG = `<path d="M17 6 Q20 -6 23 6 Z" fill="${hairColor}"/>`;

  return `<svg class="stick" width="40" height="52" viewBox="0 0 40 52">
    ${auraSVG}
    <circle cx="20" cy="10" r="7" fill="${skin}"/>
    ${hairSVG}
    <path d="M13 19 L27 19 L25 33 L15 33 Z" fill="${outfit}"/>
    <line x1="20" y1="21" x2="9" y2="30" stroke="${outfit}" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="21" x2="31" y2="30" stroke="${outfit}" stroke-width="4" stroke-linecap="round"/>
    <line x1="17" y1="33" x2="11" y2="48" stroke="${outfit2}" stroke-width="4" stroke-linecap="round"/>
    <line x1="23" y1="33" x2="29" y2="48" stroke="${outfit2}" stroke-width="4" stroke-linecap="round"/>
    ${!alive?'<line x1="12" y1="4" x2="28" y2="18" stroke="#d1495b" stroke-width="2.5"/><line x1="28" y1="4" x2="12" y2="18" stroke="#d1495b" stroke-width="2.5"/>':''}
  </svg>`;
}

function nextFxNonce(b){ return (b.lastFx ? b.lastFx.nonce : 0) + 1; }

/* Envia a ação da rodada (atacar, trocar, ou Ultimate-meteoro). Fica guardada
   em `pending` até o adversário também escolher a dele — só então o turno
   resolve, na ordem de velocidade (ver maybeResolveTurn em part7). */
async function submitAction(action){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  const b = state.battle;
  if(b.mustSwitch && b.mustSwitch[myKey]) return;      // precisa resolver a troca forçada primeiro
  if(b.pending && b.pending[myKey]) return;             // já escolheu essa rodada
  if(action.type==="switch" && b.hp[action.charId]<=0) return;
  if(!b.pending) b.pending = {p1:null, p2:null};
  b.pending[myKey] = action;
  if(maybeResolveTurn(state)) await postAction(state);
  else await commitAndDraw(state);
}

// Troca OBRIGATÓRIA: seu lutador ativo caiu. Grátis, não passa pelo `pending`
// — o adversário pode até já ter escolhido a ação dele e ficar esperando você.
async function doForcedSwitch(id){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  const b = state.battle;
  if(!b.mustSwitch || !b.mustSwitch[myKey]) return;
  if(b.hp[id]<=0) return;
  const newC = charById(id);
  b.activeChar[myKey] = id;
  b.mustSwitch[myKey] = false;
  b.log.unshift(`${playerName(state,myKey)} manda ${newC.name} para o campo!`);
  if(maybeResolveTurn(state)) await postAction(state);
  else await commitAndDraw(state);
}

async function postAction(state){
  checkForcedSwitch(state);
  const p1Alive = aliveIds(state,"p1").length>0;
  const p2Alive = aliveIds(state,"p2").length>0;
  if(!p1Alive || !p2Alive){
    state.phase="battleover";
    state.winner = p1Alive ? "p1" : "p2";
  }
  await commitAndDraw(state);
}

function applyAction(state, attackerId, atkIdx, targetId){
  const c = charById(attackerId);
  const atk = c.attacks[atkIdx];
  const b = state.battle;
  if(!b.tempDef) b.tempDef = {};
  const fxEffects = [];
  const fxColor = ELEMENT_GLOW[c.element] || "#e0b559";
  const fxShape = fxShapeFor(c.element, atk.dmgType);
  for(let i=0;i<4;i++){ if(b.cooldowns[attackerId][i]>0) b.cooldowns[attackerId][i]--; }
  if(b.cooldowns[attackerId][atkIdx]>0 || (atk.onceOnly && b.onceUsed[attackerId][atkIdx])){
    b.log.unshift(`${c.name} tentou usar ${atk.name}, mas ainda não está pronto.`);
  } else {
    // ---- ESQUIVA / PRECISÃO ----
    // Rolado UMA vez, aqui, na máquina de quem age. O resultado vai gravado no
    // estado, então os dois clientes veem o mesmo desfecho — nada é re-sorteado
    // do outro lado.
    let errou = false;
    if(targetId && (atk.power>0 || atk.effect)){
      const risco = chanceErro(state, attackerId, targetId, atk);
      if(risco > 0 && Math.random()*100 < risco){
        errou = true;
        const tgt = charById(targetId);
        const esq = Math.round(chanceEsquiva(state, attackerId, targetId));
        b.log.unshift(`${c.name} usou ${atk.name} — ${tgt.name} desviou! (${Math.round(risco)}% de chance de erro${esq>0?`, ${esq}% por velocidade`:''})`);
        fxEffects.push({targetId, kind:"miss"});
      }
    }

    if(!errou && atk.power>0 && targetId){
      const tgt = charById(targetId);
      const dmg = calcDano(state, attackerId, targetId, atk);
      const wasAlive = b.hp[targetId]>0;
      b.hp[targetId] = Math.max(0, b.hp[targetId]-dmg);
      b.log.unshift(`${c.name} usou ${atk.name} em ${tgt.name}: ${dmg} de dano.`);
      // Defesa temporária do alvo é consumida no instante em que ele apanha.
      if(b.tempDef[targetId]){ delete b.tempDef[targetId]; }
      checkDeathPenalty(state, targetId, wasAlive);
      checkGrowOnHit(state, targetId, wasAlive);
      checkExplodeOnDeath(state, targetId, wasAlive);
      fxEffects.push({targetId, kind:"hit", color:fxColor, shape:fxShape, value:dmg});
      if(b.hp[targetId]<=0) b.log.unshift(`${tgt.name} foi derrotado!`);
    }
    if(atk.effect && !errou){
      if(atk.effect.type==="shield"){
        b.tempDef[attackerId] = {fis: atk.effect.value, mag: atk.effect.value};
        b.log.unshift(`${c.name} reforça a defesa em +${atk.effect.value} até ser atingido.`);
        fxEffects.push({targetId:attackerId, kind:"shield", color:"#8fc0ff"});
      } else if(atk.effect.type==="heal"){
        const cap = maxLifeOf(state, attackerId);
        const before = b.hp[attackerId];
        b.hp[attackerId] = Math.min(cap, b.hp[attackerId]+atk.effect.value);
        b.log.unshift(`${c.name} recupera ${atk.effect.value} de vida.`);
        fxEffects.push({targetId:attackerId, kind:"heal", value:b.hp[attackerId]-before});
      } else if(atk.effect.type==="debuff" && targetId){
        const tgt = charById(targetId);
        const k = atk.dmgType==="physical"?"fis":"mag";
        if(!b.tempDef[targetId]) b.tempDef[targetId] = {fis:0, mag:0};
        b.tempDef[targetId][k] = -atk.effect.value;
        b.log.unshift(`${tgt.name} fica vulnerável (-${atk.effect.value} de defesa até ser atingido).`);
      } else if(atk.effect.type==="stun" && targetId){
        const tgt = charById(targetId);
        if(!b.stunImmune) b.stunImmune = {};
        if(b.stunImmune[targetId] && b.stunImmune[targetId].turnsLeft>0){
          b.log.unshift(`${tgt.name} está imune a atordoamento e resistiu ao efeito!`);
        } else {
          b.stunned[targetId]=true;
          b.stunImmune[targetId] = {turnsLeft:3};
          b.log.unshift(`${tgt.name} ficou atordoado! (imune a novo atordoamento pelas próximas 3 rodadas dele)`);
          fxEffects.push({targetId, kind:"stun"});
        }
      } else if(atk.effect.type==="dot" && targetId){
        const tgt = charById(targetId);
        b.dot[targetId] = {value: atk.effect.value, turnsLeft: 2, source: atk.dmgType==="physical"?"Sangramento":(c.element==="Fogo"?"Queimadura":c.element==="Venenoso"?"Veneno":"Efeito contínuo")};
        b.log.unshift(`${tgt.name} sofre ${b.dot[targetId].source.toLowerCase()} (${atk.effect.value} de dano por turno)!`);
      }
    }
    if(atk.cooldown>0) b.cooldowns[attackerId][atkIdx]=atk.cooldown;
    if(atk.onceOnly) b.onceUsed[attackerId][atkIdx]=true;
  }
  b.lastFx = {nonce: nextFxNonce(b), attackerId, effects: fxEffects};
  b.stunned[attackerId]=false;
  tickStunImmunity(state, attackerId);
  tickSelfRecoil(state, attackerId);

  // Dano contínuo (queimadura/veneno) tickando uma vez por turno global.
  Object.keys(b.dot).forEach(id=>{
    if(b.hp[id]<=0){ delete b.dot[id]; return; }
    const d = b.dot[id];
    const dTgt = charById(id);
    const wasAlive = b.hp[id]>0;
    b.hp[id] = Math.max(0, b.hp[id]-d.value);
    b.log.unshift(`${dTgt.name} perde ${d.value} de vida por ${d.source.toLowerCase()}.`);
    checkDeathPenalty(state, id, wasAlive);
    checkGrowOnHit(state, id, wasAlive);
    checkExplodeOnDeath(state, id, wasAlive);
    if(b.hp[id]<=0) b.log.unshift(`${dTgt.name} foi derrotado pelo ${d.source.toLowerCase()}!`);
    d.turnsLeft -= 1;
    if(d.turnsLeft<=0) delete b.dot[id];
  });

  tickTransformDuration(state, attackerId);
}

/* Ultimate METEORO agora é uma AÇÃO DA RODADA — escolhida via submitAction e
   executada dentro de maybeResolveTurn, na vez que a velocidade do personagem
   determinar. Chamada por executeAction() em part7.html. */
function executeMeteorUltimate(state, ultId){
  const c = charById(ultId);
  const b = state.battle;
  b.ultimateUsed[ultId] = true;
  const ultColor = ELEMENT_GLOW[c.element] || "#e0b559";
  b.log.unshift(`${c.name} ativa o Ultimate: ${c.ultimate.name}! Um poder descontrolado atinge todo mundo em campo, ignorando qualquer defesa.`);
  const fxEffects = [];
  [...state.teams.p1, ...state.teams.p2].filter(id=>id!==ultId && b.hp[id]>0).forEach(otherId=>{
    const tgt = charById(otherId);
    const isAlly = teamOf(state,otherId)===teamOf(state,ultId);
    const baseDmg = isAlly ? Math.round(c.ultimate.aoeDmg*0.5) : c.ultimate.aoeDmg;
    const dmg = Math.max(5, baseDmg);
    const wasAlive = b.hp[otherId]>0;
    b.hp[otherId] = Math.max(0, b.hp[otherId]-dmg);
    checkDeathPenalty(state, otherId, wasAlive);
    checkGrowOnHit(state, otherId, wasAlive);
    checkExplodeOnDeath(state, otherId, wasAlive);
    fxEffects.push({targetId:otherId, kind:"hit", color:ultColor, shape:fxShapeFor(c.element, c.ultimate.dmgType), value:dmg});
    b.log.unshift(`${tgt.name} sofre ${dmg} de dano do Ultimate de ${c.name} (ignora defesa)${isAlly?' — aliado, dano reduzido pela metade':''}.`);
    if(b.hp[otherId]<=0) b.log.unshift(`${tgt.name} foi derrotado!`);
  });
  b.lastFx = {nonce: nextFxNonce(b), attackerId: ultId, meteor:true, color:ultColor, effects: fxEffects};
  tickTransformDuration(state, ultId);
  tickStunImmunity(state, ultId);
}

/* Transformação — ação GRÁTIS: não entra no `pending`, não usa a rodada, então
   o mesmo personagem ainda escolhe e envia uma ação normal em seguida. Toda
   transformação paga ALGUM preço: no mínimo o corte temporário de defesa
   abaixo, e para alguns (Might Guy, Tenshinhan, Edward) um preço extra
   próprio da história deles. */
async function useUltimate(){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  const ultId = state.ultimateChoice[myKey];
  const activeId = state.battle.activeChar[myKey];
  if(!ultId || ultId!==activeId || state.battle.ultimateUsed[ultId]) return;
  const c = charById(ultId);
  if(c.ultimate.kind==="meteor") return; // meteoro vai por submitAction({type:"ultimate"})
  const b = state.battle;
  if(!b.tempDef) b.tempDef = {};
  if(!b.transformed) b.transformed = {};
  if(!b.growOnHit) b.growOnHit = {};
  if(!b.transformActive) b.transformActive = {};
  if(!b.selfRecoil) b.selfRecoil = {};
  b.ultimateUsed[ultId]=true;

  b.maxLifeBonus[ultId] = c.ultimate.lifeBonus;
  b.hp[ultId] = Math.min(maxLifeOf(state,ultId), b.hp[ultId]+c.ultimate.lifeBonus);
  b.atkBonus[ultId] = c.ultimate.atkBonus;
  b.transformed[ultId] = true;
  // Dispara a animação de duas fases nos DOIS clientes: quem transformou vê
  // pelo redesenho imediato, o adversário vê quando o polling trouxer a
  // revisão nova. O nonce garante que cada um toque a animação uma vez só.
  b.lastFx = {nonce: nextFxNonce(b), kind:"transform", targetId: ultId, name: c.ultimate.name};

  let baselineFis = b.def[ultId].fis;
  let baselineMag = b.def[ultId].mag;
  let extraLog = "";

  if(c.ultimate.permanentDefCost){
    baselineFis = Math.max(10, baselineFis - c.ultimate.permanentDefCost);
    baselineMag = Math.max(10, baselineMag - c.ultimate.permanentDefCost);
    extraLog += ` Paga um preço permanente: -${c.ultimate.permanentDefCost} de defesa pro resto da luta.`;
  }
  if(c.ultimate.upfrontToll){
    b.hp[ultId] = Math.max(1, b.hp[ultId]-c.ultimate.upfrontToll);
    extraLog += ` Perde ${c.ultimate.upfrontToll} de vida na hora como sacrifício pra ativar.`;
  }
  if(c.ultimate.selfRecoil){
    b.selfRecoil[ultId] = {value:c.ultimate.selfRecoil.value, turnsLeft:c.ultimate.selfRecoil.turns};
    extraLog += ` Vai perder ${c.ultimate.selfRecoil.value} de vida a cada rodada própria durante ${c.ultimate.selfRecoil.turns} rodadas.`;
  }

  b.def[ultId].fis = Math.max(10, Math.round(baselineFis*0.6));
  b.def[ultId].mag = Math.max(10, Math.round(baselineMag*0.6));
  b.transformActive[ultId] = {turnsLeft:3, original:{fis:baselineFis, mag:baselineMag}};

  let growNote = "";
  if(c.ultimate.growPerHit){
    b.growOnHit[ultId] = {perHit:c.ultimate.growPerHit, cap:c.ultimate.growCap, current:0};
    growNote = ` Quanto mais apanhar a partir de agora, mais forte fica (até +${c.ultimate.growCap} de dano extra)${c.ultimate.explodeOnDeath?' — mas se cair com poder acumulado, ele explode nos próprios aliados!':''}.`;
  }
  b.log.unshift(`${c.name} se transforma: ${c.ultimate.name}! (+${c.ultimate.lifeBonus} vida, +${c.ultimate.atkBonus} de ataque, -40% de defesa por até 3 rodadas próprias)${extraLog}${growNote}`);
  await commitAndDraw(state);
}

function renderBattleOver(state){
  const winner = state.winner;
  app.innerHTML = `
    <div class="eyebrow">Fim de jogo</div>
    <h1>${playerName(state,winner)} venceu a batalha!</h1>
    <div class="card">
      <div class="log">${state.battle.log.slice(0,20).map(l=>`<div>${l}</div>`).join("")}</div>
    </div>
    <div class="card">
      <h3>Revanche na mesma sala</h3>
      <p class="hint">Ninguém precisa sair nem digitar código de novo — vocês continuam na sala <strong>${state.code}</strong>.</p>
      <div class="row" style="gap:8px; margin-top:10px;">
        <button class="btn primary" onclick="rematch('${state.mode||"auction"}')">Repetir ${(state.mode||"auction")==="draft"?"Sorteio":"Leilão"}</button>
        <button class="btn" onclick="rematch('${(state.mode||"auction")==="draft"?"auction":"draft"}')">Trocar para ${(state.mode||"auction")==="draft"?"Leilão":"Sorteio"}</button>
      </div>
      <div class="center" style="margin-top:12px;"><button class="btn" onclick="leaveRoom()">Sair da sala</button></div>
    </div>
  `;
}

/* Reinicia a partida PRESERVANDO sala, código e jogadores.
   Monta um estado novo do zero e recoloca só o que deve sobreviver — mais
   seguro que zerar campo a campo, porque um campo de batalha esquecido
   (cooldown, dot, transformação) vazaria para a partida seguinte. */
async function rematch(mode){
  const atual = await loadRoom(ROOM_CODE);
  if(!atual) return;
  const novo = newRoomState(atual.code);
  novo.rev = atual.rev;                 // mantém a contagem pro polling do outro acordar
  novo.players = atual.players;
  novo.difficulty = atual.difficulty;
  novo.mode = mode;
  novo.phase = "lobby";
  novo.log = [`Nova partida na mesma sala — modo ${mode==="draft"?"Sorteio":"Leilão"}.`];
  await commitAndDraw(novo);
}

function renderDone(state){
  app.innerHTML = `
    <div class="eyebrow">Times prontos</div>
    <h1>Equipes finais</h1>
    <div class="players-grid">
      ${[1,2].map(slot=>{
        const key="p"+slot;
        const team = state.teams[key].map(id=>charById(id));
        const ultId = state.ultimateChoice[key];
        return `<div class="player-panel">
          <h3>Jogador ${slot} <span class="money">R$${state.budget[key]} restante</span></h3>
          ${team.map(c=>`
            <div class="mini-card" style="margin-top:8px;">
              <div class="mn">${c.name} <span class="badge rank-${c.rankKey}">${c.rank}</span> ${ultId===c.id?'<span class="badge ult">Ultimate ativo</span>':''}</div>
              <div class="ma">${c.anime} · Vida ${c.vida}</div>
            </div>`).join("")}
        </div>`;
      }).join("")}
    </div>
    <p class="hint center">Times completos! Usem essas fichas pra jogar a batalha (turno a turno, respeitando cooldowns, tipos de dano e habilidades de uso único).</p>
  `;
}

render();
</script>
