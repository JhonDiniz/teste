<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena de Leilão — Anime Battle Draft</title>
<style>
  :root{
    --bg: #0d0f14;
    --panel: #161922;
    --panel2: #1e222e;
    --line: #2a2f3d;
    --gold: #e0b559;
    --gold-dim: #8a6f36;
    --crimson: #d1495b;
    --crimson-dim: #6b2530;
    --teal: #4fb3a9;
    --text: #eceef2;
    --text-dim: #9aa0af;
    --weak: #7a8194;
    --medium: #4fb3a9;
    --strong: #d1495b;
    --physical: #e0b559;
    --magic: #7f77dd;
    --radius: 10px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 700px 400px at 20% -5%, rgba(224,181,89,.10) 0%, transparent 60%),
      radial-gradient(ellipse 700px 400px at 85% 0%, rgba(209,73,91,.08) 0%, transparent 60%),
      radial-gradient(circle at 50% 0%, #1a1e29 0%, var(--bg) 60%);
    color: var(--text);
    margin:0;
    min-height:100vh;
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 920px; margin:0 auto;}
  h1,h2,h3{font-weight:700; letter-spacing:.3px; margin:0 0 6px;}
  h1{font-size:26px;}
  h2{font-size:19px;}
  h3{font-size:15px;}
  .eyebrow{
    text-transform:uppercase; font-size:11px; letter-spacing:2px; color: var(--gold);
    font-weight:700; margin-bottom:4px;
  }
  .sub{color:var(--text-dim); font-size:14px; margin-bottom:20px;}
  .card{
    background: linear-gradient(180deg, var(--panel), #12141c);
    border:1px solid var(--line);
    border-top:2px solid var(--gold-dim);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom:16px;
  }
  .btn{
    background: linear-gradient(180deg, #2a2f3d, #1e222e);
    border:1px solid var(--line);
    color: var(--text);
    padding: 11px 18px;
    border-radius: 8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover{border-color: var(--gold-dim);}
  .btn:active{transform: scale(.97);}
  .btn.primary{background: linear-gradient(180deg, #e0b559, #c79a3f); color:#1a1509; border:none; box-shadow:0 2px 10px rgba(224,181,89,.25);}
  .btn.primary:hover{box-shadow:0 3px 16px rgba(224,181,89,.4); transform:translateY(-1px);}
  .btn.danger{background: linear-gradient(180deg, #d1495b, #a83447); color:#fff; border:none;}
  .diff-btn{flex:1;}
  .diff-btn.active{background:linear-gradient(180deg,var(--teal),#0f6e56); color:#fff; border:none;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  input[type=text], input[type=number]{
    background: var(--panel2);
    border:1px solid var(--line);
    color: var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    width:100%;
  }
  label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .center{text-align:center;}
  .logo-badge{display:flex; justify-content:center; margin-bottom:10px; filter:drop-shadow(0 0 18px rgba(224,181,89,.35));}
  .code-display{
    font-size:38px; font-weight:800; letter-spacing:8px; color:var(--gold);
    text-align:center; padding:14px 0; font-family: monospace;
  }
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px;
    font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  }
  .badge.weak{background:rgba(122,129,148,.18); color:var(--weak);}
  .badge.medium{background:rgba(79,179,169,.18); color:var(--medium);}
  .badge.strong{background:rgba(209,73,91,.18); color:var(--strong);}
  .badge.physical{background:rgba(224,181,89,.18); color:var(--physical);}
  .badge.magic{background:rgba(127,119,221,.18); color:#a29bea;}
  .badge.hybrid{background:rgba(224,181,89,.12); color:#c9b98a;}
  .badge.ult{background:rgba(209,73,91,.25); color:#ff8a9a; border:1px solid var(--crimson-dim);}
  .badge.once{background:rgba(224,181,89,.12); color:var(--gold); border:1px solid var(--gold-dim);}

  /* ---- Raridade (antigo S/A/B/C) ----
     mitico > lendario > raro > comum. A hierarquia é lida pela cor E pelo brilho:
     só o topo (mítico) recebe glow, exatamente pra que "mítico" nunca seja
     confundido com "lendário" numa olhada rápida no celular. */
  .badge.rank-comum{background:rgba(122,129,148,.18); color:#b7bcc9; border:1px solid #5b6273;}
  .badge.rank-raro{background:rgba(79,140,224,.18); color:#8fc0ff; border:1px solid #3f6fb0;}
  .badge.rank-lendario{background:rgba(224,181,89,.2); color:#ffd97a; border:1px solid var(--gold);}
  .badge.rank-mitico{
    background:linear-gradient(120deg, rgba(178,92,255,.28), rgba(224,90,160,.28));
    color:#e9c2ff; border:1px solid #b25cff; box-shadow:0 0 10px rgba(178,92,255,.45);
  }

  .char-hero{
    text-align:center; padding: 22px 0 10px;
  }
  .char-hero .name{font-size:26px; font-weight:800; margin-bottom:4px;}
  .char-hero .anime{color:var(--text-dim); font-size:13px; margin-bottom:10px;}
  .stat-row{display:flex; justify-content:center; gap:22px; margin:14px 0 4px; flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .val{font-size:22px; font-weight:800;}
  .stat .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  .attacks{display:grid; grid-template-columns:1fr; gap:8px; margin-top:14px;}
  .attack{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .attack .an{font-weight:700; font-size:13.5px;}
  .attack .ad{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .players-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.players-grid{grid-template-columns:1fr;}}
  .player-panel{
    background:var(--panel2); border:1px solid var(--line); border-radius: var(--radius); padding:14px;
  }
  .player-panel.leader{border-color: var(--gold-dim); box-shadow: 0 0 0 1px var(--gold-dim) inset;}
  .player-panel h3{display:flex; justify-content:space-between; align-items:center;}
  .money{color:var(--gold); font-weight:800;}
  .team-list{list-style:none; padding:0; margin:10px 0 0; font-size:13px;}
  .team-list li{padding:5px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between;}
  .team-list li:first-child{border-top:none;}
  .team-list .slot-empty{color:var(--text-dim); font-style:italic;}
  .bid-controls{display:flex; gap:8px; margin-top:12px;}
  .bid-controls input{flex:1;}
  .log{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    max-height:140px; overflow-y:auto; font-size:12.5px; color:var(--text-dim); margin-top:14px;
  }
  .log div{padding:3px 0; border-bottom:1px dashed var(--line);}
  .log div:last-child{border-bottom:none;}
  .pill-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .pill-tabs button{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text-dim);
    padding:9px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer;
  }
  .pill-tabs button.active{background:var(--gold); color:#1a1509; border-color:var(--gold);}
  .hint{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .ultimate-box{
    border:1px dashed var(--crimson-dim); background:rgba(209,73,91,.06); border-radius:8px;
    padding:10px 12px; margin-top:10px; font-size:12.5px;
  }
  .roster-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media(max-width:600px){.roster-grid{grid-template-columns:1fr;}}
  .mini-card{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px;
  }
  .mini-card .mn{font-weight:700; font-size:13.5px;}
  .mini-card .ma{font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:8px; width:100%; font-size:13px;
  }
  .status-line{font-size:12.5px; color:var(--text-dim); text-align:center; margin-top:8px;}
  .flash{animation: flashIn .4s ease;}
  @keyframes flashIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .coin-stage{display:flex; flex-direction:column; align-items:center; padding:30px 0;}
  .coin{
    width:90px; height:90px; border-radius:50%;
    background: linear-gradient(180deg,var(--gold),#a9822f);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#1a1509; font-size:13px;
    border:3px solid #7a601f;
    perspective:600px;
  }
  .coin.flipping{animation: coinFlip 1.4s ease-in-out;}
  @keyframes coinFlip{
    0%{transform:rotateY(0deg);}
    100%{transform:rotateY(1800deg);}
  }
  .turn-banner{
    text-align:center; padding:10px; border-radius:8px; margin-bottom:14px;
    background:rgba(224,181,89,.1); border:1px solid var(--gold-dim); font-weight:700; font-size:14px;
  }
  .turn-banner.opp{background:rgba(209,73,91,.08); border-color:var(--crimson-dim);}

  /* =========================================================================
     ARENA DE BATALHA — camada visual nova
     Composição: adversário no alto (visto de frente), jogador embaixo (visto de
     costas), com bastante ar entre os dois. O HUD de cada lado fica no canto
     OPOSTO ao seu lutador, pra que nenhuma barra de vida cubra um sprite.
     ========================================================================= */
  .battle-stage{
    position:relative; height:380px; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    background:
      radial-gradient(ellipse 420px 150px at 70% 30%, rgba(209,73,91,.12), transparent 70%),
      radial-gradient(ellipse 420px 150px at 30% 78%, rgba(79,179,169,.12), transparent 70%),
      linear-gradient(180deg, #171b26 0%, #10131b 55%, #0b0d13 100%);
    margin-bottom:12px;
  }
  @media(max-width:600px){ .battle-stage{height:320px;} }
  /* linha de horizonte discreta: separa "fundo" de "chão" sem desenhar cenário */
  .stage-horizon{
    position:absolute; left:0; right:0; top:52%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(224,181,89,.18), transparent);
  }
  .stage-slot{position:absolute; display:flex; flex-direction:column; align-items:center; z-index:2;}
  .slot-enemy{top:12px; right:7%;}
  .slot-player{bottom:24px; left:7%;}
  /* elipse de chão: ancora o sprite no piso em vez de deixá-lo flutuando */
  .stage-pad{
    position:absolute; border-radius:50%; z-index:1;
    background:radial-gradient(ellipse at center, rgba(224,181,89,.16) 0%, rgba(224,181,89,.05) 55%, transparent 72%);
  }
  /* As medidas abaixo não são arbitrárias: cada elipse fica centrada exatamente
     no pé do sprite correspondente (altura do sprite = largura x 44/32). Se a
     largura de um sprite mudar, o "top"/"bottom" da sua elipse muda junto. */
  .pad-enemy{width:150px; height:40px; top:130px; right:calc(7% - 15px);}
  .pad-player{width:190px; height:48px; bottom:0px; left:calc(7% - 16px);}
  @media(max-width:600px){
    .slot-enemy{top:12px;}
    .slot-player{bottom:22px;}
    .pad-enemy{width:120px; height:32px; top:104px; right:calc(7% - 12px);}
    .pad-player{width:155px; height:40px; bottom:0px; left:calc(7% - 12px);}
  }

  .sprite-box{position:relative; display:block;}
  .sprite-img{
    display:block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.55));
  }
  /* Arte final tem anti-aliasing e é exibida um pouco MENOR que o original.
     Nearest-neighbor numa redução joga pixels fora e serrilha tudo — então a
     arte em bitmap escala suave, e só o gerador procedural fica pixelado. */
  .sprite-bitmap{ image-rendering: auto; }
  /* Dimensionado por ALTURA, não por largura: a arte de frente e a de costas
     têm larguras diferentes, e usar largura faria o lutador mudar de tamanho
     ao virar de costas. O jogador é maior porque está mais perto da câmera.
     Os valores garantem que as duas caixas nunca se toquem: 130 + 172 + folga
     cabem nos 380px do palco. */
  .sprite-enemy{height:140px; width:auto;}
  .sprite-player{height:185px; width:auto;}
  @media(max-width:600px){ .sprite-enemy{height:112px;} .sprite-player{height:150px;} }

  /* --- animações de sprite --- */
  @keyframes idleBreath{
    0%,100%{transform:translateY(0) scaleY(1);}
    50%{transform:translateY(-1.5px) scaleY(1.02);}
  }
  .anim-idle{animation: idleBreath 2.6s ease-in-out infinite; transform-origin:50% 100%;}
  @keyframes enterFromBack{ from{opacity:0; transform:translate(38px,-14px) scale(.7);} to{opacity:1; transform:none;} }
  @keyframes enterFromFront{ from{opacity:0; transform:translate(-38px,16px) scale(.7);} to{opacity:1; transform:none;} }
  .anim-enter-enemy{animation: enterFromBack .42s ease-out;}
  .anim-enter-player{animation: enterFromFront .42s ease-out;}
  /* o jogador avança PRA CIMA (rumo ao inimigo), o inimigo avança PRA BAIXO */
  @keyframes lungeUp{
    0%{transform:none;} 35%{transform:translate(26px,-40px) scale(1.06);}
    55%{transform:translate(26px,-40px) scale(1.06);} 100%{transform:none;}
  }
  @keyframes lungeDown{
    0%{transform:none;} 35%{transform:translate(-26px,40px) scale(1.06);}
    55%{transform:translate(-26px,40px) scale(1.06);} 100%{transform:none;}
  }
  .anim-attack-player{animation: lungeUp .5s ease-in-out;}
  .anim-attack-enemy{animation: lungeDown .5s ease-in-out;}
  @keyframes hitRecoil{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-6px);} 35%{transform:translateX(5px);}
    55%{transform:translateX(-4px);} 75%{transform:translateX(3px);}
  }
  @keyframes hitFlash{ 0%,100%{filter:none;} 30%{filter:brightness(4) saturate(0);} 60%{filter:none;} }
  .anim-hit{animation: hitRecoil .42s ease-in-out, hitFlash .42s steps(2,end);}
  @keyframes koFall{
    0%{transform:none; opacity:1;}
    30%{transform:translateY(-4px) rotate(-6deg); opacity:1;}
    100%{transform:translateY(26px) rotate(-78deg); opacity:0;}
  }
  .anim-ko{animation: koFall .75s ease-in forwards; transform-origin:50% 100%;}
  @media(prefers-reduced-motion: reduce){
    .anim-idle,.anim-enter-enemy,.anim-enter-player,.anim-attack-player,
    .anim-attack-enemy,.anim-hit,.anim-ko{animation:none !important;}
  }

  /* --- aura de transformação (Ultimate) --- */
  .sprite-aura{
    position:absolute; inset:-16% -22%; border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse at center, var(--aura) 0%, transparent 68%);
    opacity:.55; animation: auraPulse 1.5s ease-in-out infinite;
  }
  @keyframes auraPulse{ 0%,100%{opacity:.42; transform:scale(1);} 50%{opacity:.7; transform:scale(1.07);} }
  .aura-spark{
    position:absolute; width:2px; height:9px; border-radius:2px; background:var(--aura);
    z-index:3; pointer-events:none; animation: sparkRise 1.1s linear infinite;
  }
  @keyframes sparkRise{ 0%{opacity:0; transform:translateY(6px) scaleY(.5);} 35%{opacity:1;} 100%{opacity:0; transform:translateY(-26px) scaleY(1.3);} }

  /* =======================================================================
     TRANSFORMAÇÃO (Ultimate)
     Duas fases: carrega ki (tremor + aura azul + motes subindo), depois estoura
     num clarão e vira a forma transformada. A arte de carga já traz a aura azul
     pintada, então a aura dourada de CSS fica escondida durante essa fase —
     senão as duas se sobrepõem e viram uma sopa de cor.
     ======================================================================= */
  .stage-charging{ animation: chargeQuake .16s linear infinite; }
  @keyframes chargeQuake{
    0%,100%{transform:translate(0,0);} 25%{transform:translate(-1.5px,1px);}
    50%{transform:translate(1.5px,-1px);} 75%{transform:translate(-1px,-1.5px);}
  }
  .charge-glow{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse 55% 50% at var(--gx) var(--gy), rgba(90,190,255,.42), transparent 72%);
    animation: chargePulse .42s ease-in-out infinite alternate;
  }
  @keyframes chargePulse{ from{opacity:.45;} to{opacity:1;} }
  .ki-mote{
    position:absolute; width:4px; height:11px; border-radius:2px; pointer-events:none;
    background:linear-gradient(180deg,#d6f2ff,#3aa6ff); box-shadow:0 0 9px #58c0ff;
    animation: kiRise 1s ease-in forwards;
  }
  @keyframes kiRise{
    0%{opacity:0; transform:translateY(0) scaleY(.6);}
    20%{opacity:1;}
    100%{opacity:0; transform:translateY(-95px) scaleY(1.6);}
  }
  .sprite-box.charging .sprite-aura, .sprite-box.charging .aura-spark{ display:none; }

  /* Faixa do título. O deslize é rápido nas pontas e lento no centro — daí a
     curva (.1,.8,.9,.2), que sobe depressa, chapa no meio e dispara de novo.
     Deslocamento e opacidade são DUAS animações separadas de propósito: cada
     uma precisa da sua própria curva de tempo. */
  .ult-title{
    position:fixed; left:0; right:0; top:36%; z-index:9999; pointer-events:none;
    text-align:center; white-space:nowrap; font-style:italic;
    font-size:clamp(30px, 10vw, 74px); font-weight:900; letter-spacing:3px;
    color:#fff6c4;
    text-shadow:0 0 8px #ffd54a, 0 0 26px #ff9d2e, 0 4px 0 #7a4a00, 0 8px 20px rgba(0,0,0,.75);
    animation: ultSweep 3.4s cubic-bezier(.1,.8,.9,.2) forwards,
               ultFade  3.4s linear forwards;
  }
  @keyframes ultSweep{ from{transform:translateX(-125vw);} to{transform:translateX(125vw);} }
  @keyframes ultFade{ 0%{opacity:0;} 9%{opacity:1;} 88%{opacity:1;} 100%{opacity:0;} }
  @media(prefers-reduced-motion: reduce){
    .stage-charging{animation:none !important;}
    .ult-title{animation: ultFade 3.4s linear forwards !important; transform:none !important;}
  }

  /* --- escolha de modo na tela inicial --- */
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  @media(max-width:600px){ .mode-grid{grid-template-columns:1fr;} }
  .mode-card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-top:2px solid var(--line);
    border-radius:var(--radius); padding:14px; cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .mode-card:hover{border-color:var(--gold-dim);}
  .mode-card:active{transform:scale(.985);}
  .mode-card.sel{border-color:var(--gold); border-top-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .mode-ico{font-size:26px; line-height:1;}
  .mode-name{font-weight:800; font-size:16px; margin:6px 0 4px;}
  .mode-desc{font-size:12px; color:var(--text-dim); line-height:1.45;}

  /* --- cartas do sorteio --- */
  .draft-grid{display:flex; flex-direction:column; gap:8px;}
  .draft-card{
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .draft-card:hover{border-color:var(--gold);}
  .draft-card:active{transform:scale(.99);}
  /* Altura fixa na arte: os sprites têm proporções diferentes e sem isso as
     cartas ficariam com alturas desiguais, quebrando a leitura da lista. */
  .draft-art{width:52px; display:flex; justify-content:center; flex:0 0 auto;}
  .draft-art .sprite-img{height:56px; width:auto;}
  .draft-art .stick{height:56px; width:auto;}
  .draft-info{flex:1; min-width:0;}
  .draft-name{font-weight:700; font-size:15px;}
  .draft-meta{margin-top:5px;}

  /* --- HUD de combate --- */
  .hud{
    position:absolute; z-index:4; width:190px; padding:8px 10px 9px; border-radius:10px;
    background:linear-gradient(180deg, rgba(30,34,46,.94), rgba(18,20,28,.94));
    border:1px solid var(--line); backdrop-filter:blur(2px);
  }
  .hud-enemy{top:14px; left:14px; border-left:3px solid var(--crimson);}
  .hud-player{bottom:14px; right:14px; border-right:3px solid var(--teal);}
  @media(max-width:600px){ .hud{width:150px; padding:6px 8px 7px;} .hud-enemy{top:10px; left:10px;} .hud-player{bottom:10px; right:10px;} }
  .hud-top{display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
  .hud-name{font-weight:700; font-size:12.5px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hud-hp-num{font-size:10.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; flex:0 0 auto;}
  .hud-bar{height:7px; background:#05060a; border-radius:4px; overflow:hidden; margin-top:5px; border:1px solid rgba(0,0,0,.6);}
  .hud-bar-fill{height:100%; border-radius:3px; transition:width .45s ease;}
  .hp-high{background:linear-gradient(90deg,#2f8f4a,#5fd07a);}
  .hp-mid{background:linear-gradient(90deg,#a9822f,#e0b559);}
  .hp-low{background:linear-gradient(90deg,#7a2b34,#d1495b);}

  .hud-tag{padding:1px 5px; border-radius:20px; background:rgba(255,255,255,.06); white-space:nowrap;}

  /* --- efeitos elementais e de impacto --- */
  .fx-layer{position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .fx-anchor{position:absolute; width:0; height:0;}
  .fx-burst{
    position:absolute; left:-34px; top:-34px; width:68px; height:68px; border-radius:50%;
    background:radial-gradient(circle, var(--fx) 0%, transparent 62%);
    animation: burstPop .55s ease-out forwards; opacity:0;
  }
  @keyframes burstPop{ 0%{opacity:0; transform:scale(.3);} 30%{opacity:.85; transform:scale(1);} 100%{opacity:0; transform:scale(1.5);} }
  .fx-particle{
    position:absolute; width:4px; height:4px; border-radius:50%; background:var(--fx);
    animation: particleFly .6s ease-out forwards; box-shadow:0 0 5px var(--fx);
  }
  @keyframes particleFly{ 0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--px),var(--py)) scale(.2);} }
  /* gelo e metal viram cacos angulares em vez de bolinhas */
  .fx-particle.shard{border-radius:0; width:3px; height:8px;}
  /* elétrico: risco reto em vez de partícula */
  .fx-bolt{
    position:absolute; width:2px; height:30px; background:var(--fx); box-shadow:0 0 6px var(--fx);
    animation: boltFlick .34s steps(3,end) forwards;
  }
  @keyframes boltFlick{ 0%{opacity:1;} 100%{opacity:0;} }
  .fx-slash{
    position:absolute; left:-26px; top:-3px; width:52px; height:5px; border-radius:4px;
    background:linear-gradient(90deg, transparent, var(--fx), transparent);
    animation: slashSweep .35s ease-out forwards;
  }
  @keyframes slashSweep{ 0%{opacity:0; transform:scaleX(.2) rotate(-24deg);} 40%{opacity:1;} 100%{opacity:0; transform:scaleX(1.3) rotate(-24deg);} }
  .fx-dmg{
    position:absolute; font-weight:800; font-size:19px; color:#fff; z-index:6;
    text-shadow:0 2px 0 #6b1420, 0 0 10px rgba(0,0,0,.8); pointer-events:none;
    animation: dmgFloat .95s ease-out forwards;
  }
  .fx-dmg.heal{color:#8fe0a0; text-shadow:0 2px 0 #14401f;}
  @keyframes dmgFloat{ 0%{opacity:0; transform:translate(-50%,4px) scale(.6);} 20%{opacity:1; transform:translate(-50%,-8px) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-38px) scale(1);} }
  /* meteoro: clarão de tela inteira + tremor da arena */
  .stage-flash{position:absolute; inset:0; background:var(--fx); opacity:0; z-index:7; pointer-events:none; animation: stageFlash .7s ease-out forwards;}
  @keyframes stageFlash{ 0%{opacity:0;} 18%{opacity:.72;} 100%{opacity:0;} }
  @keyframes stageQuake{
    0%,100%{transform:translate(0,0);}
    10%{transform:translate(-5px,3px);} 25%{transform:translate(5px,-3px);}
    40%{transform:translate(-4px,-2px);} 55%{transform:translate(4px,3px);}
    70%{transform:translate(-3px,1px);} 85%{transform:translate(3px,-1px);}
  }
  .stage-quake{animation: stageQuake .6s ease-in-out;}
  .meteor-streak{
    position:absolute; top:-40px; width:5px; height:56px; border-radius:4px;
    background:linear-gradient(180deg, transparent, var(--fx));
    box-shadow:0 0 14px var(--fx); animation: meteorDrop .55s ease-in forwards;
  }
  @keyframes meteorDrop{ 0%{opacity:0; transform:translateY(0) rotate(14deg);} 20%{opacity:1;} 100%{opacity:0; transform:translateY(340px) rotate(14deg);} }

/* =========================================================================
   MOTOR DE SPRITES — pixel art procedural
   =========================================================================
   ESPECIFICAÇÃO VISUAL (vale para os 135 personagens quando forem migrados):

     Resolução base ........ 48 x 64 px lógicos
     Proporção ............. cabeça ~17px de 64 => ~1:3.7 (sprite de luta 2D)
     Pose .................. guarda de combate: pernas afastadas e flexionadas,
                             punhos erguidos. Nunca posição de sentido.
     Contorno .............. 1px, #140f14, aplicado automaticamente
     Luz ................... vinda de cima-esquerda
     Sombreamento .......... rampa de 4 tons por região, gerada automaticamente:
                             realce na borda superior-esquerda, base no miolo,
                             sombra e sombra forte descendo até a borda
                             inferior-direita. Sem gradiente, sem anti-aliasing.
     Escala na arena ....... nearest-neighbor (image-rendering: pixelated)
     Paleta ................ 6 a 9 cores nomeadas por personagem. As variantes
                             de sombra/realce NÃO são escolhidas à mão: derivam
                             da cor base, então trocar a paleta troca o
                             personagem inteiro sem redesenhar um pixel.
     FRENTE ................ rosto visível, usada pelo ADVERSÁRIO em batalha,
                             pelo índice e pelas telas de time.
     COSTAS ................ sem rosto, cabelo visto por trás, emblema/nó das
                             costas visíveis. Usada pelo lutador DO JOGADOR.
                             Nunca é o sprite de frente espelhado.

   Por que procedural e não uma imagem por personagem: 135 personagens x 2
   vistas x 2 poses seriam 540 arquivos. Aqui cada personagem é ~15 linhas de
   dados, o arquivo continua único, e nada é baixado da rede.
   ========================================================================= */

const SPR_W = 48, SPR_H = 64;
const SPR_OUTLINE = "#140f14";

function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

class PixGrid{
  constructor(w,h){ this.w=w; this.h=h; this.d=new Array(w*h).fill(null); this.tone=new Array(w*h).fill(0); }
  i(x,y){ return y*this.w+x; }
  inb(x,y){ return x>=0 && y>=0 && x<this.w && y<this.h; }
  get(x,y){ return this.inb(x,y) ? this.d[this.i(x,y)] : null; }
  set(x,y,slot){ if(this.inb(x,y)) this.d[this.i(x,y)] = slot; }
  // pinta só onde já existe alguma coisa — serve pra dobra de roupa e sombra
  paintOver(x,y,slot){ if(this.inb(x,y) && this.d[this.i(x,y)]) this.d[this.i(x,y)] = slot; }
  rect(x,y,w,h,slot){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) this.set(i,j,slot); }
  rectOver(x,y,w,h,slot){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) this.paintOver(i,j,slot); }
  ellipse(cx,cy,rx,ry,slot){
    for(let j=Math.floor(cy-ry); j<=Math.ceil(cy+ry); j++)
      for(let i=Math.floor(cx-rx); i<=Math.ceil(cx+rx); i++){
        const dx=(i-cx)/rx, dy=(j-cy)/ry;
        if(dx*dx+dy*dy <= 1.02) this.set(i,j,slot);
      }
  }
  limb(x0,y0,x1,y1,w0,w1,slot){
    const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0), 1)*2;
    for(let s=0; s<=steps; s++){
      const t=s/steps;
      const cx=x0+(x1-x0)*t, cy=y0+(y1-y0)*t, w=w0+(w1-w0)*t, half=w/2;
      for(let i=Math.round(cx-half); i<=Math.round(cx+half); i++)
        for(let j=Math.round(cy-half*0.55); j<=Math.round(cy+half*0.55); j++)
          this.set(i,j,slot);
    }
  }
  spike(bx,by,tx,ty,halfW,slot){
    const steps = Math.max(Math.abs(tx-bx), Math.abs(ty-by), 1)*2;
    for(let s=0; s<=steps; s++){
      const t=s/steps;
      const cx=bx+(tx-bx)*t, cy=by+(ty-by)*t, hw=halfW*(1-t*t)+0.4;
      for(let i=Math.round(cx-hw); i<=Math.round(cx+hw); i++)
        for(let j=Math.round(cy-hw*0.5); j<=Math.round(cy+hw*0.5); j++)
          this.set(i,j,slot);
    }
  }
}

/* Rampa de 4 tons gerada automaticamente:
     tone 3 = realce  (borda superior-esquerda, onde a luz bate)
     tone 0 = base
     tone 1 = sombra  (uma casa pra dentro da borda escura)
     tone 2 = sombra forte (borda inferior-direita)
   Isso é o que separa "boneco chapado" de "sprite com volume": um único tom
   escuro no contorno deixa tudo plano; a rampa dá curvatura ao braço e ao peito. */
// Regiões pequenas e chapadas por natureza NÃO entram na rampa: um olho de
// 5x3 px recebendo realce + sombra vira uma bolha cinza em vez de um olho.
// O mesmo vale para dobras e traços, que já SÃO a sombra.
const FLAT_SLOTS = new Set(["eye","eyeWhite","mouth","emblemInk","skinShade","topShade","bootsole"]);

function autoShade(g){
  const out = g.tone;
  const rim = new Array(g.w*g.h).fill(0); // 1 = borda escura, 2 = borda clara
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    const s = g.get(x,y); if(!s || FLAT_SLOTS.has(s)) continue;
    const dark  = g.get(x+1,y)!==s || g.get(x,y+1)!==s;
    const light = g.get(x-1,y)!==s || g.get(x,y-1)!==s;
    if(dark){ rim[g.i(x,y)]=1; out[g.i(x,y)]=2; }
    else if(light){ rim[g.i(x,y)]=2; out[g.i(x,y)]=3; }
  }
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    const s = g.get(x,y); if(!s || FLAT_SLOTS.has(s) || rim[g.i(x,y)]) continue;
    if(rim[g.i(x+1,y)]===1 || rim[g.i(x,y+1)]===1) out[g.i(x,y)]=1;
  }
}

function autoOutline(g){
  const add = [];
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    if(g.get(x,y)) continue;
    if(g.get(x-1,y)||g.get(x+1,y)||g.get(x,y-1)||g.get(x,y+1)) add.push([x,y]);
  }
  add.forEach(([x,y])=> g.set(x,y,"__outline"));
}

/* ---------- corpo em pose de luta ---------- */
// Postura parada de combate, não posição de sentido: pernas afastadas e
// flexionadas, punhos erguidos na altura do peito. Um sprite de braços colados
// no corpo lê como "personagem esperando", não como "personagem lutando".
const BODY = {
  cx:24,
  headCy:19, headRx:6, headRy:7,
  browY:17, eyeY:19, mouthY:24,
  neckTop:25, neckBot:29,
  shoulderY:29, shoulderHW:9,
  waistY:42, waistHW:6,
  sashTop:41, sashBot:45,
  hipY:45, ankleY:57,
  bootTop:55, bootBot:62
};

function drawBody(g, r, view, pose){
  const B = BODY, cx = B.cx;
  const atk = pose==="attack";

  // --- pernas afastadas, com joelho ---
  const kneeY = 51, footOut = 8;
  g.limb(cx-3, B.hipY, cx-6, kneeY, 8, 7, "bottom");
  g.limb(cx-6, kneeY, cx-footOut, B.ankleY, 7, 6, "bottom");
  g.limb(cx+3, B.hipY, cx+6, kneeY, 8, 7, "bottom");
  g.limb(cx+6, kneeY, cx+footOut, B.ankleY, 7, 6, "bottom");

  // --- botas ---
  const bootH = B.bootBot-B.bootTop+1;
  g.rect(cx-footOut-4, B.bootTop, 8, bootH, "boots");
  g.rect(cx+footOut-3, B.bootTop, 8, bootH, "boots");
  g.rect(cx-footOut-4, B.bootTop, 8, 2, "bootcuff");   // cano claro
  g.rect(cx+footOut-3, B.bootTop, 8, 2, "bootcuff");
  g.rect(cx-footOut-4, B.bootBot, 8, 1, "bootsole");
  g.rect(cx+footOut-3, B.bootBot, 8, 1, "bootsole");

  // --- torso: trapézio ombro -> cintura ---
  for(let y=B.shoulderY; y<=B.waistY; y++){
    const t=(y-B.shoulderY)/(B.waistY-B.shoulderY);
    const hw = Math.round(B.shoulderHW + (B.waistHW-B.shoulderHW)*t);
    g.rect(cx-hw, y, hw*2+1, 1, "top");
  }
  // faixa na cintura + nó lateral
  g.rect(cx-B.waistHW-1, B.sashTop, (B.waistHW+1)*2+1, B.sashBot-B.sashTop+1, "sash");
  if(view==="front"){
    g.rect(cx-B.waistHW-2, B.sashTop+1, 3, 3, "sash");
    g.rect(cx-B.waistHW-2, B.sashBot+1, 2, 3, "sash");
  } else {
    g.rect(cx+B.waistHW-1, B.sashTop+1, 3, 3, "sash");
    g.rect(cx+B.waistHW, B.sashBot+1, 2, 3, "sash");
  }

  // --- braços: ombro -> cotovelo -> punho ---
  const fist = (fx,fy)=>{
    g.rect(fx, fy, 5, 5, "skin");
    g.rect(fx, fy+5, 5, 3, "band");        // munhequeira
    g.rect(fx+1, fy+2, 3, 1, "skinShade"); // linha dos nós dos dedos
  };
  let L, R;
  if(atk && view==="front"){        // soco descendo rumo ao jogador
    L = [[cx-7,31],[cx-14,38],[cx-17,45]];
    R = [[cx+7,31],[cx+12,34],[cx+13,37]];
  } else if(atk){                   // de costas: soco subindo rumo ao inimigo
    L = [[cx-7,31],[cx-12,34],[cx-13,37]];
    R = [[cx+7,31],[cx+14,25],[cx+17,18]];
  } else {                          // guarda
    L = [[cx-7,31],[cx-13,36],[cx-14,40]];
    R = [[cx+7,31],[cx+13,36],[cx+14,40]];
  }
  [[L,-1],[R,1]].forEach(([P,dir])=>{
    g.limb(P[0][0],P[0][1], P[1][0],P[1][1], 8, 6, "sleeve");
    g.limb(P[1][0],P[1][1], P[2][0],P[2][1], 6, 5, "skin");
    fist(P[2][0] + (dir<0 ? -4 : -1), P[2][1]-2);
  });

  // --- pescoço e cabeça ---
  g.rect(cx-3, B.neckTop, 7, B.neckBot-B.neckTop, "skin");
  g.rect(cx-3, B.neckTop, 7, 2, "skinShade"); // sombra do queixo no pescoço
  g.ellipse(cx, B.headCy, B.headRx, B.headRy, view==="back" ? "hair" : "skin");
}

function drawFace(g){
  const B = BODY, cx = B.cx;
  // Olhos com esclera clara e pupila escura: dois quadrados pretos leem como
  // "olho fechado". A esclera é o que dá o olhar de anime nesta escala.
  g.rect(cx-6, B.browY, 5, 1, "hair");
  g.rect(cx+2, B.browY, 5, 1, "hair");
  g.rect(cx-6, B.eyeY, 5, 3, "eyeWhite");
  g.rect(cx+2, B.eyeY, 5, 3, "eyeWhite");
  g.rect(cx-4, B.eyeY, 3, 3, "eye");
  g.rect(cx+2, B.eyeY, 3, 3, "eye");
  g.rect(cx-1, B.eyeY+3, 2, 1, "skinShade"); // nariz
  g.rect(cx-2, B.mouthY+1, 4, 1, "mouth");   // 2px abaixo do nariz, senão vira bigode
}

/* ---------- cabelo ----------
   O cabelo é a assinatura de um personagem de anime e não sai de fórmula: cada
   espinho aqui é um dado (base, ponta, espessura). Trocar o personagem é trocar
   essa lista, não reescrever o gerador. */
const HAIR = {
  goku(g, view){
    const B = BODY, cx = B.cx;
    // Touca COLADA no crânio. Uma touca folgada + espinhos gordos vira afro:
    // o que faz cabelo de anime ler como espetado é o espaço vazio ENTRE as
    // mechas, não a quantidade de mechas.
    const capBottom = view==="back" ? B.headCy+B.headRy : B.browY-1;
    for(let y=B.headCy-B.headRy-1; y<=capBottom; y++){
      const dy=(y-B.headCy)/(B.headRy+1);
      const hw = Math.round((B.headRx+1)*Math.sqrt(Math.max(0,1-dy*dy)));
      if(hw>0) g.rect(cx-hw, y, hw*2+1, 1, "hair");
    }
    // 9 mechas, cada uma um dado [baseX, baseY, pontaX, pontaY, espessura].
    // Trocar de personagem = trocar esta lista.
    const S = [
      [cx-1,  13, cx-3,  0,  2.6],  // mecha central alta
      [cx-5,  13, cx-9,  1,  2.3],
      [cx+4,  13, cx+7,  0,  2.3],
      [cx-7,  14, cx-14, 4,  2.1],
      [cx+7,  14, cx+13, 3,  2.1],
      [cx-8,  16, cx-18, 9,  1.9],
      [cx+8,  16, cx+17, 8,  1.9],
      [cx+1,  13, cx+2,  3,  1.9],
      [cx-3,  13, cx-4,  4,  1.7],
      [cx+6,  15, cx+10, 8,  1.7]
    ];
    S.forEach(k=> g.spike(k[0],k[1],k[2],k[3],k[4],"hair"));
    // costeletas curtas, até a altura do olho
    g.rect(cx-8, B.browY-1, 2, 5, "hair");
    g.rect(cx+7, B.browY-1, 2, 5, "hair");
    if(view==="back"){
      // Nuca curta: descendo demais, o cabelo engolia o emblema das costas —
      // que é justamente o que torna a vista traseira reconhecível.
      g.rect(cx-6, B.headCy+5, 13, 3, "hair");
      g.spike(cx-3, B.headCy+7, cx-5, B.headCy+11, 2.2, "hair");
      g.spike(cx+3, B.headCy+7, cx+5, B.headCy+11, 2.2, "hair");
      g.spike(cx,   B.headCy+7, cx,   B.headCy+10, 2.2, "hair");
    }
  }
};

/* ---------- traje ---------- */
const OUTFIT = {
  gi(g, view){
    const B = BODY, cx = B.cx;
    if(view==="front"){
      // gola em V da camisa de baixo + as duas lapelas cruzadas do gi
      g.rect(cx-4, B.shoulderY,   9, 2, "under");
      g.rect(cx-3, B.shoulderY+2, 7, 2, "under");
      g.rect(cx-1, B.shoulderY+4, 3, 2, "under");
      g.rectOver(cx-7, B.shoulderY+1, 2, 8, "topShade");
      g.rectOver(cx+6, B.shoulderY+1, 2, 8, "topShade");
      // dobras verticais do gi
      g.rectOver(cx-3, B.shoulderY+7, 1, 5, "topShade");
      g.rectOver(cx+3, B.shoulderY+7, 1, 5, "topShade");
    } else {
      const ey = B.shoulderY+7;
      g.ellipse(cx, ey, 4.4, 4.4, "emblem");
      g.rect(cx-2, ey-2, 5, 1, "emblemInk");
      g.rect(cx,   ey-1, 1, 1, "emblemInk");
      g.rect(cx-2, ey,   5, 1, "emblemInk");
      g.rect(cx,   ey+1, 1, 1, "emblemInk");
      g.rect(cx-2, ey+2, 5, 1, "emblemInk");
      g.rectOver(cx-7, B.shoulderY+1, 2, 9, "topShade");
      g.rectOver(cx+6, B.shoulderY+1, 2, 9, "topShade");
    }
  }
};
/* =========================================================================
   ARTE EXTERNA
   =========================================================================
   As artes agora moram em arquivos, não embutidas. O jogo deixou de ser um
   arquivo único — foi uma troca deliberada: com transformação para vários
   personagens, embutir tudo faria o HTML passar de vários MB e travar o
   primeiro carregamento no celular. Em arquivos, o navegador baixa só o que
   entra em campo e cacheia o resto.

   Estrutura esperada, ao lado do HTML:

     arena-de-leilao.html
     assets/sprites/<slug>/front.png
                          back.png
                          charge-front.png    (opcional)
                          charge-back.png     (opcional)
                          ssj-front.png       (opcional)
                          ssj-back.png        (opcional)

   Acrescentar personagem = soltar a pasta + uma linha em ART. Nada mais.

   TODAS as artes precisam sair do prepare_sprite.py, que normaliza o canvas
   para 210x245 com a sola dos pés e o centro do corpo ancorados no mesmo ponto.
   É isso que faz a troca de imagem não deslocar nada durante a transformação.
   Arte solta, no recorte que veio, faz o personagem pular de tamanho.
   ========================================================================= */
const ASSET_BASE = "assets/sprites/";
const SPRITE_CANVAS = {w:210, h:245};

const STATE_FILE = {
  front:"front.png", back:"back.png",
  chargeFront:"charge-front.png", chargeBack:"charge-back.png",
  ssjFront:"ssj-front.png", ssjBack:"ssj-back.png"
};

// `states` lista o que existe de verdade na pasta. O jogo nunca pede um arquivo
// que não foi declarado — assim um personagem pode ter só frente e costas, sem
// transformação, e nada quebra.
const ART = {
  "Son Goku": {
    slug: "son-goku",
    states: ["front","back","chargeFront","chargeBack","ssjFront","ssjBack"]
  }
};

function artURL(c, state){
  const a = ART[c.name];
  if(!a || a.states.indexOf(state) < 0) return null;
  return ASSET_BASE + a.slug + "/" + STATE_FILE[state];
}
function bitmapFor(c, view, transformed){
  const side = (view==="back" ? "Back" : "Front");
  if(transformed){
    const t = artURL(c, "ssj"+side);
    if(t) return t;
  }
  return artURL(c, side.toLowerCase());
}
function chargeBitmapFor(c, view){
  return artURL(c, "charge" + (view==="back" ? "Back" : "Front"));
}
function hasArt(c){ return !!ART[c.name]; }

/* Pré-carga: sem isso, o quadro de carga de ki só começa a baixar no instante
   em que o Ultimate é acionado, e a primeira fase da animação aparece em branco.
   Só pré-carrega quem está em campo — 135 personagens de uma vez seria pior que
   o arquivo embutido que estamos justamente removendo. */
const preloaded = {};
function preloadArt(c){
  const a = ART[c.name];
  if(!a || preloaded[c.name]) return;
  preloaded[c.name] = true;
  a.states.forEach(st=>{ const im = new Image(); im.src = artURL(c, st); });
}

/* Se um arquivo faltar ou falhar, o personagem cai no stick figure em vez de
   virar um ícone de imagem quebrada. Vale para quem ainda não tem arte pronta. */
function artFailed(img, charId){
  const c = charById(charId);
  if(!c || !img.parentNode) return;
  const wrap = document.createElement("span");
  wrap.innerHTML = stickFigureSVG(c, true, false);
  img.parentNode.replaceChild(wrap.firstChild, img);
}

/* ---------- registro de sprites ----------
   Só quem estiver aqui usa pixel art. Todo o resto cai automaticamente no
   stick figure antigo, então o jogo nunca fica meio quebrado durante a migração. */
const SPRITES = {
  "Son Goku": {
    hair: "goku",
    outfit: "gi",
    palette: {
      skin:"#f2c49a", skinShade:"#d1966b", hair:"#1e181c",
      eye:"#2b2328", eyeWhite:"#f6f2ec", mouth:"#8a4a42",
      top:"#ea7d1e", topShade:"#bf5f10", sleeve:"#cf6a12", bottom:"#e37a22",
      sash:"#2f4f9e", under:"#2f4f9e",
      boots:"#2f4f9e", bootcuff:"#e8e3d8", bootsole:"#1b2f61",
      band:"#efeae0", emblem:"#efeae0", emblemInk:"#2a2320"
    },
    // Super Saiyajin: só o cabelo muda de slot na paleta. Nenhuma matriz é redesenhada.
    transformPalette: { hair:"#f6d84e" },
    auraColor: "#ffe27a"
  }
};

const spriteCache = {};

// Gera (e cacheia) o dataURL de um sprite. view: "front" | "back".
// pose: "idle" | "attack". transformed: aplica a paleta alternativa.
function spriteURL(c, view, pose, transformed){
  const def = SPRITES[c.name];
  if(!def) return null;
  const key = c.name+"|"+view+"|"+pose+"|"+(transformed?"t":"n");
  if(spriteCache[key]) return spriteCache[key];

  const g = new PixGrid(SPR_W, SPR_H);
  drawBody(g, def, view, pose);
  if(HAIR[def.hair]) HAIR[def.hair](g, view);
  if(view==="front") drawFace(g, def);
  if(OUTFIT[def.outfit]) OUTFIT[def.outfit](g, view);
  autoShade(g);
  autoOutline(g);

  const pal = Object.assign({}, def.palette, transformed ? (def.transformPalette||{}) : {});
  const cv = document.createElement("canvas");
  cv.width = SPR_W; cv.height = SPR_H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(SPR_W, SPR_H);
  for(let i=0;i<g.d.length;i++){
    const slot = g.d[i];
    if(!slot) continue;
    let hex;
    if(slot==="__outline") hex = SPR_OUTLINE;
    else {
      const base = pal[slot] || "#ff00ff"; // magenta = slot faltando na paleta
      const tone = g.tone[i];
      hex = tone===1 ? shadeColor(base,-22)
          : tone===2 ? shadeColor(base,-46)
          : tone===3 ? shadeColor(base, 24)
          : base;
    }
    const n = parseInt(hex.slice(1),16);
    img.data[i*4]   = (n>>16)&0xff;
    img.data[i*4+1] = (n>>8)&0xff;
    img.data[i*4+2] = n&0xff;
    img.data[i*4+3] = 255;
  }
  ctx.putImageData(img,0,0);
  const url = cv.toDataURL("image/png");
  spriteCache[key] = url;
  return url;
}

function hasSprite(c){ return hasArt(c) || !!SPRITES[c.name]; }

// Ponto único de renderização de um lutador. Usa pixel art quando existe e
// stick figure quando não — quem chama não precisa saber qual dos dois veio.
function fighterArt(c, opts){
  const o = opts || {};
  const view = o.view || "front";
  const pose = o.pose || "idle";
  const cls  = o.className || "";
  // Ordem de preferência: arte final > gerador procedural > stick figure.
  const bmp = bitmapFor(c, view, o.transformed);
  if(bmp){
    return `<img class="sprite-img sprite-bitmap ${cls}" src="${bmp}" alt="${c.name}"`
         + ` draggable="false" onerror="artFailed(this,'${c.id}')">`;
  }
  const url = spriteURL(c, view, pose, o.transformed);
  if(url){
    return `<img class="sprite-img ${cls}" src="${url}" alt="${c.name}" draggable="false">`;
  }
  return stickFigureSVG(c, o.alive!==false, o.transformed);
}

/* ---- RARIDADE ----
   Os quatro tiers antigos (S/A/B/C) agora são Mítico / Lendário / Raro / Comum.
   Os limiares de percentil e o cálculo do score continuam exatamente os mesmos:
   a mudança é só de nome e de cor. `rankKey` é a versão sem acento usada em
   classe CSS; `rank` é o rótulo que aparece na tela. */
const RANK_TIERS = [
  {pct:0.15, key:"mitico",   label:"Mítico"},
  {pct:0.40, key:"lendario", label:"Lendário"},
  {pct:0.75, key:"raro",     label:"Raro"},
  {pct:1.01, key:"comum",    label:"Comum"}
];
const ULT_TIERS = ["mitico","lendario"]; // só esses dois recebem Ultimate

(function rankCharacters(){
  const scored = CHARACTERS.map(c=>{
    const atkPower = c.attacks.reduce((sum,a)=> sum + (a.dmg||0), 0);
    const effectBonus = c.attacks.filter(a=>a.effect).length * 6;
    const score = c.life + (c.physShield+c.magShield)*1.3 + atkPower*1.4 + effectBonus;
    return {c, score};
  }).sort((a,b)=>b.score-a.score);
  const n = scored.length;
  scored.forEach((entry,i)=>{
    const pct = i/n;
    const tier = RANK_TIERS.find(t=> pct < t.pct);
    entry.c.rank = tier.label;
    entry.c.rankKey = tier.key;
    if(ULT_TIERS.includes(tier.key)){
      const u = ULTIMATES[entry.c.name];
      if(u) entry.c.ultimate = u.kind==="meteor"
        ? {name:u.name, kind:"meteor", aoeDmg:u.aoeDmg, dmgType:u.dmgType, desc:u.desc}
        : {name:u.name, kind:"transform", lifeBonus:u.lifeBonus, dmgBonus:u.dmgBonus,
           growPerHit:u.growPerHit||null, growCap:u.growCap||null, explodeOnDeath:!!u.explodeOnDeath,
           selfRecoil:u.selfRecoil||null, upfrontToll:u.upfrontToll||null, permanentShieldCost:u.permanentShieldCost||null,
           desc:u.desc};
    }
  });
})();

function genCode(){
  const letters="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<5;i++) s+=letters[Math.floor(Math.random()*letters.length)];
  return s;
}

const TEAM_SIZE = 5;      // vale para os dois modos
const DRAFT_OPTIONS = 5;  // quantos personagens aparecem por rodada no sorteio

function newRoomState(code){
  const shuffled=[...CHARACTERS].sort(()=>Math.random()-0.5);
  const pool = shuffled.slice(0,20).map(c=>c.id);
  return {
    code,
    rev: 0,
    mode: "auction",              // "auction" (leilão) | "draft" (sorteio)
    draftOptions: {p1:[], p2:[]}, // as 5 cartas na mão de cada um, no sorteio
    difficulty: "easy",
    players:{p1:null, p2:null},
    budget: {p1:20, p2:20},
    teams: {p1:[], p2:[]},
    pool,
    poolIndex:0,
    phase:"lobby",
    currentBid:{amount:0, by:null},
    turnToAct:null,
    passedThisChar:{p1:false, p2:false},
    coinResult:null,
    ultimateChoice:{p1:null, p2:null},
    log:[]
  };
}

async function loadRoom(code){
  try{
    const doc = await db.collection("rooms").doc(code).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error("Erro ao carregar sala:", e); return null; }
}
async function saveRoom(state){
  try{
    state.rev = (state.rev||0)+1;
    await db.collection("rooms").doc(state.code).set(state);
  }catch(e){ console.error("Erro ao salvar sala:", e); }
}
async function commitAndDraw(state){
  await saveRoom(state);
  LAST_STATE = state;
  LAST_REV = state.rev;
  draw(state);
}

function charById(id){ return CHARACTERS.find(c=>c.id===id); }

/* ============ NOME SALVO ============
   Guardado no navegador, então sobrevive a recarregar a página. Fica no
   aparelho — não vai pro Firestore e não sai daqui.
   Tudo em try/catch porque navegação privada e alguns navegadores embutidos
   bloqueiam o armazenamento: se falhar, o jogo continua pedindo o nome a cada
   vez em vez de quebrar. */
const NAME_KEY = "arena_nome";
function savedName(){
  try{ return localStorage.getItem(NAME_KEY) || ""; }catch(e){ return ""; }
}
function saveName(n){
  try{ localStorage.setItem(NAME_KEY, n); }catch(e){}
}
function forgetName(){
  try{ localStorage.removeItem(NAME_KEY); }catch(e){}
  render();
}

/* ============ RENDER ============ */
const app = document.getElementById("app");

function render(){
  if(showingIndex){ renderCharIndex(); return; }
  if(!ROOM_CODE){ renderHome(); return; }
  return loadRoom(ROOM_CODE).then(state=>{
    if(!state){ renderHome(); return; }
    LAST_STATE = state;
    LAST_REV = state.rev||0;
    draw(state);
  });
}

// Só redesenha se a revisão da sala AVANÇOU. Um fetch de polling que começou
// antes do seu clique pode terminar depois dele, trazendo uma revisão mais
// velha do que a que você já gravou; o "<=" descarta essa resposta atrasada
// em vez de deixar ela sobrescrever a tela mais nova.
function poll(){
  if(!ROOM_CODE) return;
  // Segura o redesenho enquanto uma animação longa está no ar. Não mexe em
  // LAST_REV: assim que a trava cair, o próximo poll traz e desenha o estado.
  if(Date.now() < animLock) return;
  return loadRoom(ROOM_CODE).then(state=>{
    if(!state) return;
    const rev = state.rev||0;
    if(rev<=LAST_REV) return;
    LAST_STATE = state;
    LAST_REV = rev;
    draw(state);
  });
}

function draw(state){
  if(state.phase==="lobby") renderLobby(state);
  else if(state.phase==="auction") renderAuction(state);
  else if(state.phase==="draft") renderDraft(state);
  else if(state.phase==="ultimate") renderUltimate(state);
  else if(state.phase==="order") renderOrder(state);
  else if(state.phase==="coinflip") renderCoinflip(state);
  else if(state.phase==="battle") renderBattle(state);
  else if(state.phase==="battleover") renderBattleOver(state);
  else if(state.phase==="done") renderDone(state);
}

let selectedDifficulty = "easy";
function setDifficulty(mode){
  selectedDifficulty = mode;
  const easyBtn = document.getElementById("diffEasyBtn");
  const hardBtn = document.getElementById("diffHardBtn");
  const hint = document.getElementById("diffHint");
  if(easyBtn) easyBtn.classList.toggle("active", mode==="easy");
  if(hardBtn) hardBtn.classList.toggle("active", mode==="hard");
  if(hint) hint.textContent = mode==="easy"
    ? "Fácil: mostra a raridade (Comum a Mítico) de cada personagem durante o leilão."
    : "Difícil: a raridade fica escondida — vocês julgam só pelo nome, classe e elemento.";
}

function playerName(state,key){
  return (state.players[key] && state.players[key].name) || ("Jogador "+key.slice(1));
}
function otherKey(key){ return key==="p1"?"p2":"p1"; }

function leaveRoom(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  ROOM_CODE = null; MY_SLOT = null; LAST_STATE = null; LAST_REV = -1;
  render();
}

async function createRoom(){
  const name = savedName() || "Jogador 1";
  const code = genCode();
  const state = newRoomState(code);
  state.mode = selectedMode;
  state.difficulty = selectedDifficulty;
  state.players.p1 = {name};
  await saveRoom(state);
  ROOM_CODE = code; MY_SLOT = 1;
  startPolling();
}

async function joinRoom(){
  const name = savedName() || "Jogador 2";
  const el = document.getElementById("joinCode");
  const code = (el && el.value || "").trim().toUpperCase();
  if(!code){ return; }
  const state = await loadRoom(code);
  if(!state){ alert("Sala não encontrada. Confira o código."); return; }
  if(!state.players.p1){
    state.players.p1 = {name};
    await saveRoom(state);
    ROOM_CODE = code; MY_SLOT = 1;
  } else if(!state.players.p2){
    state.players.p2 = {name};
    await saveRoom(state);
    ROOM_CODE = code; MY_SLOT = 2;
  } else {
    // Sala cheia: provavelmente é o próprio jogador voltando depois de recarregar
    // a página. Reassume o slot cujo nome bate, em vez de virar um terceiro.
    ROOM_CODE = code;
    MY_SLOT = (state.players.p1.name === name) ? 1 : 2;
  }
  startPolling();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  render();
  pollTimer = setInterval(poll, 2000);
}

async function goToCoinflip(){
  const state = await loadRoom(ROOM_CODE);
  state.phase = "coinflip";
  await commitAndDraw(state);
}

async function startAuction(){
  if(MY_SLOT!==1) return;
  const state = await loadRoom(ROOM_CODE);
  if(state.phase!=="coinflip") return;
  state.phase = "auction";
  setupCharacterTurn(state);
  state.log.unshift("Leilão iniciado — orçamento de R$20 cada, abertura de lance alternando por personagem.");
  await commitAndDraw(state);
}

function setupCharacterTurn(state){
  let opener = openerFor(state, state.poolIndex);
  if(state.teams[opener].length>=5) opener = otherKey(opener);
  state.turnToAct = opener;
  state.currentBid = {amount:0, by:null};
  state.passedThisChar = {p1:false, p2:false};
}

function openerFor(state, idx){
  return idx%2===0 ? state.coinResult : otherKey(state.coinResult);
}

function renderAuction(state){
  if(state.poolIndex >= state.pool.length || (state.teams.p1.length>=5 && state.teams.p2.length>=5)){
    finishAuction(state);
    return;
  }
  const currentId = state.pool[state.poolIndex];
  const c = charById(currentId);
  if(!c){ advanceCharacter(state); return; }

  const myKey = "p"+MY_SLOT;
  const oppKey = otherKey(myKey);
  const myTurn = state.turnToAct===myKey;
  const isOpening = state.currentBid.amount===0;
  const myBudget = state.budget[myKey];

  let controlsHTML = "";
  if(isOpening){
    controlsHTML = myTurn
      ? `<h3 style="margin-bottom:10px;">É a sua vez de abrir o lance</h3>
         <div class="bid-controls">
           <input type="number" id="bidAmt" placeholder="Valor do lance (R$)">
           <button class="btn primary" onclick="openBid()">Dar lance</button>
           <button class="btn danger" onclick="openDesist()">Passar</button>
         </div>
         <p class="hint">Seu saldo: R$ ${myBudget} · Vagas restantes: ${5-state.teams[myKey].length}</p>`
      : `<h3 style="margin-bottom:6px;">Aguardando ${playerName(state,oppKey)} abrir o lance...</h3>`;
  } else {
    const leaderName = playerName(state, state.currentBid.by);
    controlsHTML = myTurn
      ? `<h3 style="margin-bottom:10px;">Lance atual: <span class="money">R$ ${state.currentBid.amount}</span> (liderando: ${leaderName})</h3>
         <div class="bid-controls">
           <input type="number" id="bidAmt" placeholder="Novo valor (R$)">
           <button class="btn primary" onclick="raiseBid()">Aumentar lance</button>
           <button class="btn danger" onclick="respondDesist()">Passar</button>
         </div>
         <p class="hint">Seu saldo: R$ ${myBudget} · Vagas restantes: ${5-state.teams[myKey].length}</p>`
      : `<h3 style="margin-bottom:6px;">Lance atual: <span class="money">R$ ${state.currentBid.amount}</span> — você está liderando! Aguardando resposta de ${playerName(state,oppKey)}...</h3>`;
  }

  app.innerHTML = `
    <div class="eyebrow">Leilão — ${state.poolIndex+1} / ${state.pool.length}</div>
    <h1>Disputa em andamento</h1>
    <div class="card">
      <div class="char-hero">
        <span class="badge ${c.type}">${c.type==='physical'?'Físico':c.type==='magic'?'Mágico':'Híbrido'}</span>
        ${state.difficulty==="easy" ? `<span class="badge rank-${c.rankKey}">${c.rank}</span>` : ''}
        <div class="name" style="margin-top:8px;">${c.name}</div>
        <div class="anime">${c.anime}</div>
        <div class="hint" style="margin-top:4px;">${c.class} · <span class="badge element-${c.element}">${ELEMENT_ICON[c.element]||''} ${c.element}</span></div>
        <div style="margin-top:14px; display:flex; justify-content:center;">${fighterArt(c,{view:"front", className:"sprite-enemy"})}</div>
      </div>
    </div>

function describeEffect(e){
  if(e.type==="shield") return "+"+e.value+" de escudo até ser atingido";
  if(e.type==="heal") return "cura "+e.value+" de vida";
  if(e.type==="debuff") return "-"+e.value+" no escudo do alvo até ser atingido";
  if(e.type==="stun") return "atordoa por 1 turno";
  if(e.type==="dot") return e.value+" de dano contínuo por 2 turnos";
  return "";
}

/* ============ MODO SORTEIO ============
   Cada jogador tem o PRÓPRIO sorteio, então os dois escolhem ao mesmo tempo e
   ninguém espera a vez. Isso é o que torna este modo rápido — e também o motivo
   de ele não precisar de `turnToAct`, moeda nem controle de quem abre.

   O que os dois compartilham é só a exclusão: um personagem já escolhido por
   qualquer um dos dois sai do baralho, pra não existirem dois Gokus em campo. */

// Sorteia DRAFT_OPTIONS personagens ainda livres para um jogador.
function rollDraftOptions(state, key){
  const taken = new Set([...state.teams.p1, ...state.teams.p2]);
  const livres = CHARACTERS.filter(c=>!taken.has(c.id));
  const sorteados = [];
  const pool = [...livres];
  for(let i=0; i<DRAFT_OPTIONS && pool.length; i++){
    const idx = Math.floor(Math.random()*pool.length);
    sorteados.push(pool.splice(idx,1)[0].id);
  }
  state.draftOptions[key] = sorteados;
}

async function startDraft(){
  const state = await loadRoom(ROOM_CODE);
  if(state.phase!=="lobby") return;
  state.phase = "draft";
  rollDraftOptions(state,"p1");
  rollDraftOptions(state,"p2");
  state.log.unshift(`Sorteio iniciado — cada jogador escolhe ${TEAM_SIZE} lutadores entre ${DRAFT_OPTIONS} cartas por rodada.`);
  await commitAndDraw(state);
}

async function pickDraft(charId){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.phase!=="draft") return;
  if(state.teams[myKey].length >= TEAM_SIZE) return;
  // Confere contra o estado recém-carregado: entre o desenho da tela e o clique,
  // o adversário pode ter levado esse personagem no sorteio dele.
  if(!state.draftOptions[myKey].includes(charId)) { draw(state); return; }
  const taken = new Set([...state.teams.p1, ...state.teams.p2]);
  if(taken.has(charId)){
    state.log.unshift(`Esse personagem já foi levado — sorteando outras cartas.`);
    rollDraftOptions(state, myKey);
    await commitAndDraw(state);
    return;
  }

  const c = charById(charId);
  state.teams[myKey].push(charId);
  state.log.unshift(`${playerName(state,myKey)} escolheu ${c.name}.`);

  if(state.teams[myKey].length < TEAM_SIZE){
    rollDraftOptions(state, myKey);
  } else {
    state.draftOptions[myKey] = [];
    state.log.unshift(`${playerName(state,myKey)} fechou o time!`);
  }

  if(state.teams.p1.length>=TEAM_SIZE && state.teams.p2.length>=TEAM_SIZE){
    state.phase = "ultimate";
  }
  await commitAndDraw(state);
}

let dragSrcIndex = null;
function onOrderDragStart(i){ dragSrcIndex = i; }
async function onOrderDrop(i){
  if(dragSrcIndex===null || dragSrcIndex===i){ dragSrcIndex=null; return; }
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(state.orderReady && state.orderReady[myKey]){ dragSrcIndex=null; return; }
  const arr = state.attackOrder[myKey];
  const [item] = arr.splice(dragSrcIndex,1);
  arr.splice(i,0,item);
  dragSrcIndex=null;
  await commitAndDraw(state);
}

async function moveOrderItem(index, direction){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(state.orderReady && state.orderReady[myKey]) return;
  const arr = state.attackOrder[myKey];
  const newIndex = index+direction;
  if(newIndex<0 || newIndex>=arr.length) return;
  [arr[index],arr[newIndex]] = [arr[newIndex],arr[index]];
  await commitAndDraw(state);
}
